  const pool=(mode==="local"?CONFIG.album.filter(m=>m.photo).map(m=>({src:"u:"+m.photo,u:m.photo}))
    :(cloudOwnsAlbum()||mode==="demo"?[]:CONFIG.album.filter(m=>m.photo).map(m=>({src:"u:"+m.photo,u:m.photo})))
      .concat((mode==="demo"?demoCloud.list:cloudState.list).filter(m=>m.hasPhoto).map(m=>m.src?{src:"u:"+m.src,u:m.src}:{src:"m:"+m.id,m}))).slice(0,120);
  const canUpload=mode==="cloud"||mode==="demo";
  sbPanel(`${canUpload?`<input type="file" id="sbFile" accept="image/*" class="vh"><label for="sbFile" class="btn pick" style="color:#fff!important">上傳新照片</label>
      <p class="hint" style="margin:6px 0 10px">上傳的照片會算進 ${cloudState.usage?cloudState.usage.maxPhotos:200} 張額度；從回憶挑選不佔額度。</p>`
      :'<p class="hint" style="margin-bottom:10px">從相簿挑一張照片（上傳新照片需要雲端相簿）。</p>'}
    <div class="sbpool">${pool.map((p,i)=>`<button data-i="${i}">${p.u?`<img src="${esc(p.u)}" alt="">`:`<span class="cpic" data-cid="${esc(p.m.id)}" data-v="${p.m.photoAt||0}"></span>`}</button>`).join("")||'<p class="hint">相簿裡還沒有照片。</p>'}</div>
    <p class="msg" id="sbUpMsg"></p>`,pn=>{
    hydrate(pn);
    pn.querySelectorAll(".sbpool button").forEach(b=>b.addEventListener("click",()=>sbAdd({t:"photo",src:pool[+b.dataset.i].src,x:.5,y:.45,w:.55,h:.55,r:0,border:"white",bc:"#FFFFFF"})));
    const f=pn.querySelector("#sbFile");
    if(f) f.addEventListener("change",async()=>{
      const file=f.files[0]; if(!file) return;
      const msg=pn.querySelector("#sbUpMsg"); msg.className="msg"; msg.textContent="正在壓縮照片…";
      let blob;
      try{blob=await compressImage(file);}catch(e){msg.className="msg err";msg.textContent="這張照片無法處理，請換一張。";return;}
      msg.textContent="上傳中…";
      let id;
      if(mode==="demo"){id=sbId();demoCloud.assets[id]=blob;}
      else{
        const fd=new FormData(); fd.append("photo",blob,"photo.jpg");
        let res;
        try{res=await cloudFetch("/assets",{method:"POST",body:fd});}catch(e){msg.className="msg err";msg.textContent=cloudErr(0);return;}
        if(!res.ok){msg.className="msg err";msg.textContent=await readErr(res);return;}
        const d=await res.json(); id=d.asset.id; cloudState.usage=d.usage; renderCloudStatus();
        if(photoCacheOK()){try{await (await caches.open(CLOUD_PHOTO_CACHE)).put(cloudURL("/assets/"+id),new Response(blob,{headers:{"content-type":"image/jpeg"}}));}catch(e){}}
      }
      sbURLs["a:"+id]=URL.createObjectURL(blob);
      const img=await createImageBitmap(blob).catch(()=>null), ratio=img?img.height/img.width:1;
      if(img&&img.close) img.close();
      const w=ratio>1?.45:.6;
      sbAdd({t:"photo",src:"a:"+id,x:.5,y:.45,w,h:Math.min(1.2,w*ratio),r:0,border:"white",bc:"#FFFFFF"});
    });
  });
}
function sbAction(act){
  const it=sbItem(), items=sb.cur.data.items;
  if(act==="addPhoto") return sbPhotoPanel();
  if(act==="addText") return sbTextPanel(null);
  if(act==="addSticker") return sbPanel(`<div class="sbstickers">${SB_STICKERS.map(([k,n])=>`<button data-k="${k}" aria-label="${n}"><span class="kprev" style="--c:${THEME.accent}">${sbSticker(k)}</span></button>`).join("")}</div>`,pn=>{
    // 預覽縮小到剛好放進按鈕
    pn.querySelectorAll(".kprev").forEach(k=>{const b=k.parentElement;k.style.transform=`translate(-50%,-50%) scale(${Math.min(1,(b.clientWidth-10)/k.scrollWidth,(b.clientHeight-8)/k.scrollHeight)})`;});
    pn.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.k, shape=["heart","sparkle","flower","cloud"].includes(k);
      sbAdd({t:"sticker",k,x:.5,y:.5,r:shape?0:-4,color:THEME.accent,size:shape?.06:.05});
    }));
  });
  if(act==="bg") return sbChips(SB_BGS,sb.cur.data.bg,k=>{sb.cur.data.bg=k;$("#sbPage").className="sbpage bg-"+k;sbDirty();},"bgchips");
  if(!it) return;
  if(act==="deselect"){sb.sel=null;sb.crop=false;sbPanel(null);sbRender();return;}
  if(act==="del"){sb.cur.data.items=items.filter(i=>i!==it);sb.sel=null;sbPanel(null);sbRender();sbDirty();return;}
  if(act==="up"||act==="down"){
    const i=items.indexOf(it), j=act==="up"?Math.min(items.length-1,i+1):Math.max(0,i-1);
    items.splice(i,1); items.splice(j,0,it); sbRender(); sbDirty(); return;
  }
  if(act==="crop"){sb.crop=true;sbPanel(null);sbRender();return;}
  if(act==="cropDone"){sb.crop=false;sbRender();sbDirty();return;}
  if(act==="border") return sbChips(SB_BORDERS,it.border,k=>{it.border=k;sbRefreshItem(it);sbDirty();});
  if(act==="bcolor") return sbColorPanel(it.bc,c=>{it.bc=c;sbRefreshItem(it);sbDirty();});
  if(act==="editText") return sbTextPanel(it);
  if(act==="font") return sbChips(SB_FONTS,it.font,k=>{it.font=k;sbRefreshItem(it);sbDirty();});
  if(act==="tcolor"||act==="kcolor") return sbColorPanel(it.color,c=>{it.color=c;sbRefreshItem(it);sbDirty();});
  if(act==="bold"){it.bold=!it.bold;sbRefreshItem(it);sbDirty();}
}
function sbRefreshItem(it){
  const el=document.querySelector(`#sbPage .si[data-id="${it.id}"]`); if(!el) return;
  const tmp=document.createElement("div"); tmp.innerHTML=sbItemHTML(it,true);
  const n=tmp.firstElementChild;
  const img=el.querySelector("img[src]"), nimg=n.querySelector("img");
  if(img&&nimg){nimg.src=img.src;}
  el.replaceWith(n);
}
function sbStartCrop(it){
  const el=document.querySelector(`#sbPage .si[data-id="${it.id}"]`); if(!el) return;
  const box=el.querySelector(".ph"), img=el.querySelector("img");
  const st=parseCrop(it.crop)||{x:.5,y:.5,z:1};
  attachCrop(box,img,st,()=>{it.crop=cropStr(st);});
}

/* ---------- 拖曳、縮放、旋轉 ---------- */
function sbBindStage(){
  const stage=$("#sbStage");
  const pts=new Map();
  let g=null;   // 目前的手勢
  const pageRect=()=>$("#sbPage").getBoundingClientRect();
  const center=(it,r)=>({x:r.left+it.x*r.width,y:r.top+it.y*r.height});
  const sizeOf=it=>it.t==="photo"?{w:it.w,h:it.h}:{size:it.size};
  stage.addEventListener("pointerdown",e=>{
    if(sbReadOnly()||!sb.cur) return;
    // 第二根手指：不管落在哪裡，都對目前拖曳中的物件做縮放＋旋轉
    if(g&&g.it&&pts.size===1&&!pts.has(e.pointerId)){
      e.preventDefault(); try{stage.setPointerCapture(e.pointerId);}catch(_){} pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      const [a,b]=[...pts.values()], it=g.it;
      g={mode:"pinch",it,d:Math.hypot(a.x-b.x,a.y-b.y),ang:Math.atan2(b.y-a.y,b.x-a.x),r0:it.r,s0:sizeOf(it)};
      return;
    }
    const page=$("#sbPage"); if(!page||!page.contains(e.target)) {if(e.target===stage){sb.sel=null;sb.crop=false;sbPanel(null);sbRender();}return;}
    const el=e.target.closest(".si");
    if(sb.crop&&el&&el.dataset.id===sb.sel) return;   // 裁切中：交給照片自己的拖曳
    if(!el){if(sb.sel||sb.crop){sb.sel=null;sb.crop=false;sbPanel(null);sbRender();}return;}
    const it=sb.cur.data.items.find(i=>i.id===el.dataset.id); if(!it) return;
    e.preventDefault();
    if(sb.sel!==it.id||sb.crop){sb.sel=it.id;sb.crop=false;sbPanel(null);sbRender();}
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    pts.clear(); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=pageRect(), h=e.target.dataset.h;
    if(h==="rs"){
      const c=center(it,r); g={mode:"resize",it,c,d0:Math.hypot(e.clientX-c.x,e.clientY-c.y),s0:sizeOf(it)};
    }else if(h==="rt"){
      g={mode:"rotate",it,c:center(it,r)};
    }else g={mode:"move",it,x0:it.x,y0:it.y,px:e.clientX,py:e.clientY,moved:false};
  });
  stage.addEventListener("pointermove",e=>{
    if(!g||!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const it=g.it, r=pageRect(), el=document.querySelector(`#sbPage .si[data-id="${it.id}"]`);
    if(g.mode==="move"&&pts.size===1){
      it.x=sbNum(g.x0+(e.clientX-g.px)/r.width,-.2,1.2,it.x); it.y=sbNum(g.y0+(e.clientY-g.py)/r.height,-.2,1.2,it.y);
      g.moved=true;
    }else if(g.mode==="rotate"){
      let a=Math.atan2(e.clientY-g.c.y,e.clientX-g.c.x)*180/Math.PI+90;
      if(a>180) a-=360;
      if(Math.abs(a)<4) a=0;   // 接近水平時吸附
      it.r=a;
    }else if(g.mode==="resize"){
      if(it.t==="photo"){
        // 把手指位置轉到照片自己的座標（考慮旋轉），算出新的寬高
        const dx=e.clientX-g.c.x, dy=e.clientY-g.c.y, rad=-it.r*Math.PI/180;
        const lx=dx*Math.cos(rad)-dy*Math.sin(rad), ly=dx*Math.sin(rad)+dy*Math.cos(rad);
        it.w=sbNum(2*Math.abs(lx)/r.width,.08,1.4,it.w); it.h=sbNum(2*Math.abs(ly)/r.width,.08,1.8,it.h);
      }else{
        const d=Math.hypot(e.clientX-g.c.x,e.clientY-g.c.y);
        it.size=sbNum(g.s0.size*d/Math.max(1,g.d0),.03,it.t==="text"?.3:.5,it.size);
      }
    }else if(g.mode==="pinch"&&pts.size===2){
      const [a,b]=[...pts.values()], k=Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,g.d);
      const da=(Math.atan2(b.y-a.y,b.x-a.x)-g.ang)*180/Math.PI;
      it.r=Math.round((g.r0+da)*10)/10; if(it.r>180) it.r-=360; if(it.r<-180) it.r+=360;
      if(it.t==="photo"){it.w=sbNum(g.s0.w*k,.08,1.4,it.w);it.h=sbNum(g.s0.h*k,.08,1.8,it.h);}
      else it.size=sbNum(g.s0.size*k,.03,it.t==="text"?.3:.5,it.size);
    }else return;
    if(el) el.style.cssText=sbStyle(it);
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(!g) return;
    if(g.mode==="pinch"&&pts.size===1){g={mode:"done",it:g.it};sbDirty();return;}
    if(pts.size===0){
      if(g.mode!=="move"||g.moved) sbDirty();
      g=null;
    }
  };
  stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
  // 電腦：滾輪縮放選取的物件
  stage.addEventListener("wheel",e=>{
    const it=sbItem(); if(!it||sb.crop||sbReadOnly()) return;
    e.preventDefault();
    const k=e.deltaY<0?1.06:1/1.06;
    if(it.t==="photo"){it.w=sbNum(it.w*k,.08,1.4,it.w);it.h=sbNum(it.h*k,.08,1.8,it.h);}
    else it.size=sbNum(it.size*k,.03,it.t==="text"?.3:.5,it.size);
    sbRefreshItem(it); sbDirty();
  },{passive:false});
}

/* ---------------- 問答 ---------------- */
let qi=0, score=0, locked=false;
function renderQuiz(){
  const box=$("#tab-quiz"), total=CONFIG.quiz.length;
  if(qi>=total){
    let best=store.get("ourdays_best",0); if(score>best){best=score;store.set("ourdays_best",best);}
    let msg=CONFIG.quizResult[0].text;
    CONFIG.quizResult.forEach(r=>{if(score>=r.min) msg=r.text;});
    box.innerHTML=`<div class="card"><div class="score">${score} / ${total}</div><p class="res">${esc(msg)}</p>
      <p class="res" style="margin-top:-8px;font-size:13px">最佳紀錄：${best} / ${total}</p>
      <button class="btn" id="again" style="width:100%">再玩一次</button></div>`;
    $("#again").addEventListener("click",()=>{qi=0;score=0;locked=false;renderQuiz();});
    return;
  }
  const q=CONFIG.quiz[qi];
  box.innerHTML=`<h2 style="margin:0 4px 14px;font-size:22px">你們有多了解彼此？</h2>
    <div class="card"><div class="prog"><b style="width:${(qi/total)*100}%"></b></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">第 ${qi+1} / ${total} 題</div>
    <div class="q">${esc(q.q)}</div>
    ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(locked) return; locked=true;
    const pick=+b.dataset.i;
    box.querySelectorAll(".opt").forEach((x,i)=>{if(i===q.answer)x.classList.add("ok");else if(i===pick)x.classList.add("no");});
    if(pick===q.answer) score++;
    setTimeout(()=>{qi++;locked=false;renderQuiz();},900);
  }));
}

/* ---------------- 分頁 ---------------- */
function show(tab,keepScroll){
  curTab=tab;
  ["home","dates","album","scrap","quiz"].forEach(t=>$("#tab-"+t).classList.toggle("hidden",t!==tab));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="home"){saying=null;renderHome();}
  if(tab==="dates") renderDates();
  if(tab==="album") cloudSync(false);
  if(tab==="scrap") showScrap();
  if(!keepScroll) window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));

/* ---------------- 加到主畫面與離線 ---------------- */
// 只在網站上（https 或 localhost）啟用；直接開本機檔案或在產生器預覽時略過
function setupPWA(){
  const web=location.protocol==="https:"||(location.protocol==="http:"&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname));
  if(!web||PREVIEW) return;
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.json"; document.head.appendChild(l);
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(reg=>{
    const urls=CONFIG.album.filter(m=>typeof m.photo==="string").map(m=>m.photo);
    if(urls.length&&reg.active) reg.active.postMessage({type:"ourdays-cache-photos",urls});
  }).catch(()=>{});
}

/* ---------------- 啟動 ---------------- */
let curTab="home", lastDay=dayNum(today0());
function boot(raw){
  BASE=normalize(raw);
  CONFIG=PREVIEW?BASE:withSettings(BASE,userSettings());
  START=CONFIG.startDate?parseDate(CONFIG.startDate):today0();
  applyTheme();
  qi=0; score=0; locked=false; saying=null; petTemp=null;
  cloudLoad();
  $("#credit").textContent=CONFIG.showCredit?CONFIG.creditText:"";
  sb.loaded=false; sb.pages=[];
  renderHome(); renderDates(); renderAlbum(); renderQuiz();
  show(curTab,true);
}
// 頁面放著跨過午夜，回到前景時重新計算
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(curTab==="album") cloudSync(false);
  if(curTab==="scrap"&&!sb.cur) sbLoad(true).then(renderScrapList);
  const d=dayNum(today0()); if(d===lastDay) return;
  lastDay=d; saying=null; renderHome(); renderDates(); celebrateToday();
});
if(PREVIEW){
  // 只接受外層產生器傳來的設定
  window.addEventListener("message",e=>{
    if(e.source!==window.parent||!e.data||e.data.type!=="ourdays-config") return;
    boot(e.data.config);
  });
  boot(window.CONFIG);
  window.parent.postMessage({type:"ourdays-ready"},"*");
}else if(!window.CONFIG){
  $(".wrap").innerHTML='<div class="card" style="margin-top:20px"><h3>找不到設定檔</h3><p style="color:var(--muted);margin-top:6px">請確認 config.js 和 index.html 放在同一個資料夾。</p></div>';
}else{
  boot(window.CONFIG);
  celebrateToday();
  setupPWA();
  cloudSync(true);
}
</script>
