<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF4EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我們的日子">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>我們的日子</title>
<style>
:root{
  --bg:#FBF4EC; --warm:#FFF6F1; --stage:#FBE9DF; --ground:#F3DCC9; --chip:#F0E9E1; --card:#FFFFFF; --ink:#3B2F2F; --muted:#8C7B72;
  --accent:#E26D5C; --accent-soft:#F6D6CF; --accent-tint:#FDE8E3; --accent-dark:#D45A49; --sage:#8FB8A8; --line:#EFE3D6;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
body{min-height:100vh;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top))}
h1,h2,h3,p{margin:0}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 2px 0 var(--line);margin-bottom:14px}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.act:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.sage{background:#E3EFEA;color:#4F8271}
.chip.gray{background:var(--chip);color:var(--muted)}

/* hero */
.hero{text-align:center;padding:26px 20px 22px}
.hero .names{font-size:15px;color:var(--muted);letter-spacing:.08em}
.hero .heart{width:30px;height:30px;color:var(--accent);margin:6px auto 0;animation:beat 1.8s ease-in-out infinite}
.hero .days{font-size:64px;font-weight:800;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .days small{font-size:18px;font-weight:600;color:var(--muted);margin:0 4px}
.hero .note{margin-top:8px;color:var(--muted);font-size:14px}
.next{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--warm);font-size:14px}
.next b{color:var(--accent)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* pet */
.petcard{padding-bottom:18px}
.petstage{position:relative;height:262px;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(var(--warm),var(--stage));border-radius:16px;overflow:hidden}
.petstage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--ground)}
.petsvg{width:200px;height:200px;position:relative;z-index:1;animation:float 3.2s ease-in-out infinite;cursor:pointer}
.petsvg.bounce{animation:hop .5s ease-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px)}100%{transform:translateY(0)}}
.eyes{animation:blink 4.5s infinite;transform-origin:100px 108px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;max-width:86%;
  background:#fff;border-radius:14px;padding:7px 12px;font-size:13px;box-shadow:0 2px 0 var(--line);text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.petname{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.petname h3{font-size:18px}
.bars{display:grid;gap:8px;margin-bottom:14px}
.bar{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.bar i{display:block;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.sat i b{background:var(--sage)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:0;border-radius:14px;background:var(--warm);color:var(--ink);font-weight:600;font-size:14px}
.act svg{width:26px;height:26px;color:var(--accent)}
.act:active{transform:scale(.96)}
.democtl{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.democtl button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px}
.democtl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.floaty{position:absolute;z-index:3;width:20px;height:20px;color:var(--accent);pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}

/* dates */
.sec{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:600;letter-spacing:.06em}
.item{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.item .n{text-align:center}
.item .n b{display:block;font-size:30px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.item .n span{font-size:12px;color:var(--muted)}
.item.today{background:var(--accent);color:#fff}
.item.today .n span,.item.today .meta{color:#FFE3DC}
.item .t{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px}
.form{display:grid;gap:10px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.form input,.form select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}

/* album */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.mem{position:relative;margin-bottom:14px;padding:0;cursor:pointer}
.mem .pic{border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.mem::before{content:"";position:absolute;left:-21px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.mem .pic{aspect-ratio:3/2;background:var(--chip)}
.mem .pic svg,.mem .pic img{width:100%;height:100%;display:block;object-fit:cover}
.mem .tx{padding:12px 16px 14px}
.mem .d{font-size:12px;color:var(--muted)}
.mem .tt{font-weight:700;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(59,47,47,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:440px;width:100%;padding:0;overflow:hidden;margin:0}
.modal .pic{aspect-ratio:3/2}
.modal .pic svg,.modal .pic img{width:100%;height:100%;display:block;object-fit:cover}
.modal .tx{padding:16px 20px 20px}
.modal p{color:var(--muted);margin-top:6px}

.mem .by{margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:11px}
.mem:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.cpic{width:100%;height:100%}
.cpic img{width:100%;height:100%;display:block;object-fit:cover}
.delmem{color:#B5473A;margin-top:12px;padding:6px 0}
/* cloud */
.cloud h3{font-size:17px}
.cloud .sub{font-size:13px;color:var(--muted);margin-top:2px}
.cloud .cbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cloud .cbar .btn{flex:none}
.cloud .msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1em}
.cloud .msg.err{color:#B5473A}
.cloud .banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF3DC;color:#8A6420;font-size:13px}
.form textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;resize:vertical;min-height:72px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pick{display:block!important;text-align:center;font-size:15px;color:var(--accent)!important;cursor:pointer}
.vh:focus-visible+.pick{outline:3px solid var(--accent-soft);outline-offset:2px}
.mprev{position:relative}
.mprev img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block}
.mprev .del{display:block;margin:4px auto 0}
.cloudfoot{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
.cloudfoot button{border:0;background:none;color:var(--accent);font-size:12px;text-decoration:underline;padding:4px}
.btn:disabled{opacity:.6}
/* hero 雙人照 */
.hero .couple{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;border:4px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}

/* 相框選擇 */
.framebar{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.framebar>span{font-size:13px;color:var(--muted);font-weight:600;flex:none}
.framepick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.framepick::-webkit-scrollbar{display:none}
.framepick button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink)}
.framepick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mem .fx,.mem .px{display:none}
.mem .pic{position:relative}
.mem .pic img{object-position:50% 35%}
.demohint{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--accent-tint);font-size:13px}
.demohint b{color:var(--accent);letter-spacing:.06em}
.formacts{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.memacts{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.memacts .delmem{margin:0}

/* 1 拍立得（韓系清新） */
.f-polaroid .mem{border-radius:4px;padding:10px 10px 0;box-shadow:0 6px 16px rgba(59,47,47,.10)}
.f-polaroid .mem:nth-child(odd){transform:rotate(-1.2deg)}
.f-polaroid .mem:nth-child(even){transform:rotate(1deg)}
.f-polaroid .mem .pic{border-radius:2px;aspect-ratio:1/1}
.f-polaroid .mem .tx{padding:14px 4px 18px;text-align:center}
.f-polaroid .mem .tt{font-family:"Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;font-size:18px;font-weight:600}

/* 2 和紙膠帶（日系文青） */
.f-washi .mem{border-radius:6px;padding:12px 12px 0;background:#FFFDF9}
.f-washi .mem .pic{border-radius:3px}
.f-washi .mem .fx{display:block;position:absolute;inset:0;pointer-events:none;z-index:2}
.f-washi .mem .fx::before,.f-washi .mem .fx::after{content:"";position:absolute;top:-6px;width:84px;height:24px;opacity:.9}
.f-washi .mem .fx::before{left:-12px;transform:rotate(-30deg);background:repeating-linear-gradient(45deg,var(--accent-soft) 0 6px,rgba(255,255,255,.6) 6px 12px)}
.f-washi .mem .fx::after{right:-12px;transform:rotate(28deg);background:repeating-linear-gradient(90deg,#CFE3D9 0 8px,#EAF3EE 8px 16px)}

/* 3 底片（日系文青） */
.f-film .mem{background:#1F1B1A;color:#F3E9DD;border-radius:6px;padding:24px 10px 22px;box-shadow:none}
.f-film .mem .pic{border-radius:2px}
.f-film .mem .fx{display:block;position:absolute;inset:0;pointer-events:none}
.f-film .mem .fx::before,.f-film .mem .fx::after{content:"";position:absolute;left:12px;right:12px;height:8px;border-radius:2px;opacity:.5;
  background:repeating-linear-gradient(90deg,#F3E9DD 0 8px,transparent 8px 18px)}
.f-film .mem .fx::before{top:8px}
.f-film .mem .fx::after{bottom:8px}
.f-film .mem .tx{padding:10px 4px 2px}
.f-film .mem .d{color:#F2A65A;font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}
.f-film .mem .by{background:#3A3230;color:#F3E9DD}

/* 4 奶油（韓系清新） */
.f-cream .mem{background:#FFF8EE;padding:10px;border-radius:26px;box-shadow:0 8px 20px rgba(226,180,140,.18)}
.f-cream .mem .pic{border-radius:20px;aspect-ratio:4/5}
.f-cream .mem .tx{text-align:center;padding:12px 8px 8px}

/* 5 郵票（文青） */
.f-stamp .mem{border-radius:0;padding:14px 14px 0;box-shadow:none;background:
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) 0 -6px/12px 12px repeat-x,
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) 0 calc(100% + 6px)/12px 12px repeat-x,
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) -6px 0/12px 12px repeat-y,
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) calc(100% + 6px) 0/12px 12px repeat-y,#fff}
.f-stamp .mem .pic{border-radius:0;aspect-ratio:4/5}
.f-stamp .mem .px{display:grid;place-items:center;position:absolute;top:12px;right:12px;z-index:2;width:60px;height:60px;border-radius:50%;
  border:2px solid rgba(255,255,255,.9);transform:rotate(-14deg);color:#fff;font:700 13px/1 ui-monospace,Consolas,monospace;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.f-stamp .mem .px::after{content:attr(data-d)}
.f-stamp .mem .tx{padding:10px 2px 18px}
.f-stamp .mem .tt{font-family:"Songti TC","PMingLiU","MingLiU",serif}

/* 6 雜誌（時尚） */
.f-magazine .mem{border-radius:0;padding:0;background:#151313;color:#fff;box-shadow:none}
.f-magazine .mem .pic{border-radius:0;aspect-ratio:4/5}
.f-magazine .mem .px{display:block;position:absolute;left:14px;top:12px;z-index:2;color:#fff;
  font:800 46px/1 "Didot","Bodoni 72","Times New Roman",serif;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.f-magazine .mem .px::after{content:attr(data-d)}
.f-magazine .mem .tx{padding:12px 16px 16px;border-top:3px solid var(--accent)}
.f-magazine .mem .d{color:#B9B2AC;letter-spacing:.2em;font-size:11px}
.f-magazine .mem .tt{font-size:18px;letter-spacing:.04em}
.f-magazine .mem .by{background:#333;color:#ddd}

/* 7 人生四格（韓系時尚） */
.f-booth .mem{background:#F7D9DE;padding:12px 12px 0;border-radius:4px}
.f-booth .mem .pic{border-radius:0;aspect-ratio:3/4;border:4px solid #fff}
.f-booth .mem .tx{display:flex;flex-direction:column;align-items:center;padding:10px 4px 14px}
.f-booth .mem .tx::after{content:"PHOTO  BOOTH";margin-top:8px;font:700 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.32em;color:#B5677A}
.f-booth .mem .by{background:#fff}

/* 8 拱窗（韓系清新） */
.f-arch .mem{background:#F6F0E8;padding:14px 14px 0;border-radius:24px}
.f-arch .mem .pic{border-radius:999px 999px 14px 14px;aspect-ratio:4/5;border:5px solid #fff}
.f-arch .mem .tx{text-align:center}

/* 9 格紋（日系清新） */
.f-gingham .mem{padding:18px 18px 0;border-radius:14px;
  background:linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 0) 0 0/20px 20px,
             linear-gradient(rgba(255,255,255,.55) 50%,transparent 0) 0 0/20px 20px,var(--accent-soft)}
.f-gingham .mem .pic{border-radius:8px;border:5px solid #fff}
.f-gingham .mem .tx{background:#fff;margin:16px -18px 0;border-radius:0 0 14px 14px;padding:10px 18px 14px}

/* 10 日期印（日系底片） */
.f-datestamp .mem{padding:8px;border-radius:6px}
.f-datestamp .mem .pic{border-radius:3px}
.f-datestamp .mem .px{display:block;position:absolute;right:14px;bottom:12px;z-index:2;color:#FF8A3D;
  font:600 16px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-shadow:0 0 6px rgba(255,120,40,.9)}
.f-datestamp .mem .px::after{content:attr(data-stamp)}
.f-datestamp .mem .tx{padding:10px 8px 8px}

/* 設定（齒輪、底部面板、主題） */
.hero{position:relative}
.gear{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:50%;background:var(--warm);color:var(--muted);display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.gear:focus-visible{outline:3px solid var(--accent-soft)}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(59,47,47,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.sheethead h3{font-size:18px}
.sheet .sub{font-size:13px;color:var(--muted);margin-top:4px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .msg{font-size:13px;color:var(--muted);min-height:1em}
.sheet .msg.err{color:#B5473A}
.flabel{font-size:13px;color:var(--muted);margin-bottom:6px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tchip{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 2px;font-size:12px;color:var(--ink)}
.tchip.on{border-color:var(--accent)}
.tchip i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tchip i b{width:16px;height:16px;border-radius:50%}
.tchip i.rainbow{background:conic-gradient(#F6B9A0,#F7D9DE,#CFE3D9,#CFE0F2,#E3D9F2,#FFF0C8,#F6B9A0)}
.customrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cpick{display:flex;gap:6px;align-items:center}
.cpick input[type=color]{width:40px;min-width:40px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}
.cpick input:not([type]){font-family:ui-monospace,Consolas,monospace;text-transform:uppercase;padding:8px;min-width:0}

/* 相簿卡片大小 */
.sizebar{display:flex;align-items:center;gap:10px;margin:-6px 0 16px}
.sizebar>span{font-size:13px;color:var(--muted);font-weight:600;flex:none}
.sizebar input{flex:1;accent-color:var(--accent)}
.sizebar b{font-size:13px;color:var(--accent);width:1.5em;text-align:center}
.tl{--s:1}
.tl.cols-2,.tl.cols-3{display:grid;padding-left:0;align-items:start}
.tl.cols-2{grid-template-columns:1fr 1fr;gap:12px;--s:.6}
.tl.cols-3{grid-template-columns:1fr 1fr 1fr;gap:8px;--s:.42}
.tl.cols-2::before,.tl.cols-3::before,.tl.cols-2 .mem::before,.tl.cols-3 .mem::before{display:none}
.tl.cols-2 .mem,.tl.cols-3 .mem{margin-bottom:0}
.tl.cols-2 .tx{padding:8px 10px 10px}
.tl.cols-2 .tt{font-size:14px}
.tl.cols-3 .tx{padding:6px 6px 8px}
.tl.cols-3 .tt{font-size:12px;line-height:1.3}
.tl.cols-3 .d{font-size:10px}
.tl.cols-2 .by,.tl.cols-3 .by{display:none}
.tl.cols-2>p,.tl.cols-3>p{grid-column:1/-1}
/* 小卡片時相框的邊距、裝飾跟著縮小 */
.tl.cols-2 .mem,.tl.cols-3 .mem{border-radius:calc(var(--radius)*var(--s))}
.tl.cols-2.f-polaroid .mem,.tl.cols-3.f-polaroid .mem{padding:calc(10px*var(--s)) calc(10px*var(--s)) 0}
.tl.cols-2.f-washi .mem,.tl.cols-3.f-washi .mem,.tl.cols-2.f-booth .mem,.tl.cols-3.f-booth .mem,
.tl.cols-2.f-gingham .mem,.tl.cols-3.f-gingham .mem,.tl.cols-2.f-arch .mem,.tl.cols-3.f-arch .mem,
.tl.cols-2.f-stamp .mem,.tl.cols-3.f-stamp .mem{padding:calc(14px*var(--s)) calc(14px*var(--s)) 0}
.tl.cols-2.f-gingham .tx,.tl.cols-3.f-gingham .tx{margin:calc(12px*var(--s)) calc(-14px*var(--s)) 0}
.tl.cols-2.f-cream .mem,.tl.cols-3.f-cream .mem,.tl.cols-2.f-datestamp .mem,.tl.cols-3.f-datestamp .mem{padding:calc(9px*var(--s))}
.tl.cols-2.f-film .mem,.tl.cols-3.f-film .mem{padding:calc(24px*var(--s)) calc(10px*var(--s))}
.tl.f-magazine .mem .px{font-size:calc(46px*var(--s))}
.tl.f-stamp .mem .px{width:calc(60px*var(--s));height:calc(60px*var(--s));font-size:calc(13px*var(--s));top:calc(12px*var(--s));right:calc(12px*var(--s))}
.tl.f-datestamp .mem .px{font-size:calc(16px*var(--s))}
.tl.f-washi .mem .fx::before,.tl.f-washi .mem .fx::after{width:calc(84px*var(--s));height:calc(24px*var(--s))}

/* 照片位置（拖曳、縮放） */
.cropbox{position:relative;width:100%;overflow:hidden;border-radius:12px;background:var(--chip);touch-action:none;cursor:grab}
.cropbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cropbox::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 33.3% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 66.6% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 33.3%/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 66.6%/100% 1px no-repeat}
.cropzoom{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.cropzoom input{flex:1;accent-color:var(--accent)}
.mprev .hint{font-size:12px;color:var(--muted);margin-top:4px}

/* 剪貼簿：列表 */
.pagetitle{margin:0 4px 14px;font-size:22px}
.sbhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sbhead .pagetitle{margin-bottom:14px}
.sbheadbtns{display:flex;gap:8px;margin-bottom:14px}
.sbheadbtns .btn{padding:9px 14px}
#tab-scrap .sub{font-size:13px;color:var(--muted)}
.sbgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbthumb{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink)}
.sbthumb span{display:block;font-size:13px;font-weight:600;margin-top:6px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbthumb em{font-style:normal;display:inline-block;min-width:1.6em;margin-right:6px;padding:0 5px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;text-align:center}
.sbthumb .sbpage{pointer-events:none}

/* 剪貼簿：頁面（容器單位 cqw = 頁寬的 1%；背景由程式產生 .bg-xxx） */
.sbpage{position:relative;width:100%;aspect-ratio:3/4;container-type:inline-size;overflow:hidden;border-radius:6px;
  box-shadow:0 2px 0 var(--line),0 6px 18px rgba(59,47,47,.08);user-select:none;-webkit-user-select:none}
.sbpage.blank{box-shadow:none}
.si{position:absolute;box-sizing:border-box;touch-action:none}
.s-photo .ph{width:100%;height:100%;overflow:hidden;background:#EDE4DA}
.s-photo .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.s-photo .ph.empty{background:repeating-linear-gradient(45deg,#EDE4DA 0 6px,#F5EEE6 6px 12px)}
.s-photo .ph img:not([src]){visibility:hidden}
.s-photo.b-white{border:1.4cqw solid var(--bc)}
.s-photo.b-polaroid{padding:1.8cqw 1.8cqw 7cqw;background:var(--bc);box-shadow:0 .6cqw 2cqw rgba(0,0,0,.16)}
.s-photo.b-round{border:1.2cqw solid var(--bc);border-radius:5cqw}
.s-photo.b-round .ph{border-radius:3.8cqw}
.s-photo.b-circle{border:1.2cqw solid var(--bc);border-radius:50%}
.s-photo.b-circle .ph{border-radius:50%}
.s-photo.b-tape::before,.s-photo.b-tape::after{content:"";position:absolute;z-index:1;width:32%;height:5.5cqw;background:var(--bc);opacity:.8}
.s-photo.b-tape::before{top:-2.6cqw;left:-7%;transform:rotate(-32deg)}
.s-photo.b-tape::after{bottom:-2.6cqw;right:-7%;transform:rotate(-32deg)}
.s-photo.b-tape{box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.12)}
.s-photo.b-shadow{box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.28)}
.s-text{white-space:pre;line-height:1.25;text-align:center;padding:.08em .18em}
.s-sticker{line-height:0}
.s-sticker .k{display:block;overflow:visible}
/* 選取框與控制點：畫面放大時用 --vz 反向縮放，維持手指好按的大小 */
.si.sel{outline:calc(.5cqw / var(--vz,1)) dashed var(--accent);outline-offset:calc(1.2cqw / var(--vz,1));z-index:50}
.si.cropping{outline-style:solid}
.si.cropping .ph{touch-action:none;cursor:move}
.hd{position:absolute;width:calc(7.5cqw / var(--vz,1));height:calc(7.5cqw / var(--vz,1));border-radius:50%;background:#fff;
  border:calc(.7cqw / var(--vz,1)) solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hd::after{content:"";position:absolute;inset:calc(-2.5cqw / var(--vz,1))}
.hd.rs{right:calc(-4.8cqw / var(--vz,1));bottom:calc(-4.8cqw / var(--vz,1));cursor:nwse-resize}
.hd.rt{left:50%;top:calc(-12cqw / var(--vz,1));transform:translateX(-50%);cursor:grab}
.hd.rt::before{content:"";position:absolute;left:50%;top:100%;width:calc(.5cqw / var(--vz,1));height:calc(4.3cqw / var(--vz,1));background:var(--accent);transform:translateX(-50%)}

/* 剪貼簿：編輯畫面 */
.sbedit,.sbbook{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sbtop{display:flex;gap:8px;align-items:center;padding:10px 12px}
.sbtop .btn{padding:8px 14px;flex:none}
.sbtop input{flex:1;min-width:0;font:inherit;font-weight:700;border:1px solid transparent;border-radius:10px;padding:8px 10px;background:transparent;color:var(--ink)}
.sbtop input:focus{border-color:var(--line);background:#fff;outline:none}
.sbstatus{font-size:12px;color:var(--muted);flex:none;max-width:30%;text-align:right}
.sbicon{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:var(--warm);color:var(--accent);display:grid;place-items:center}
.sbicon svg{width:20px;height:20px}
.sbstage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.sbhold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sbhold .sbpage{flex:none;transform-origin:0 0;will-change:transform}
.sbedit .si{cursor:grab}
.sbstage.panmode,.sbstage.panmode .si{cursor:move}
.sbmode{position:absolute;left:12px;top:6px;z-index:5;display:flex;padding:3px;border-radius:99px;background:#fff;box-shadow:0 1px 5px rgba(59,47,47,.15)}
.sbmode button{border:0;background:none;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.sbmode button.on{background:var(--accent);color:#fff}
.sbzoom{position:absolute;right:12px;bottom:8px;z-index:5;display:flex;align-items:center;padding:3px;border-radius:99px;background:#fff;box-shadow:0 1px 5px rgba(59,47,47,.15)}
.sbzoom button{border:0;background:none;min-width:34px;height:30px;border-radius:99px;font-size:18px;line-height:1;color:var(--ink)}
.sbzoom #sbZoomLbl{font-size:12px;min-width:48px;color:var(--muted);font-weight:600}
.sbtools{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px 8px 8px;border-top:1px solid var(--line);background:#fff;flex:none}
.sbtools::-webkit-scrollbar{display:none}
.sbtools button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:12px;color:var(--ink);padding:6px 8px;min-width:54px;border-radius:10px}
.sbtools button:active{background:var(--warm)}
.sbtools svg{width:22px;height:22px;color:var(--accent)}
.sbhint{flex:1;align-self:center;font-size:13px;color:var(--muted);padding:0 8px}
.sbpanel{background:#fff;border-top:1px solid var(--line);padding:12px 14px;max-height:42vh;overflow:auto;flex:none}
.sbchips{display:flex;flex-wrap:wrap;gap:8px}
.sbchips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;color:var(--ink)}
.sbchips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sbchips button:disabled{opacity:.4}
.sbchips button.danger{color:#B5473A;border-color:#F0C9C2}
.sbcolors{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sbcolors .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sbcolors .sw.on{box-shadow:0 0 0 2px var(--ink)}
.swc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.swc input{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}
.sbstickers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbstickers button{position:relative;display:block;height:58px;border:1px solid var(--line);border-radius:12px;background:var(--warm);overflow:hidden;padding:0}
.kprev{position:absolute;left:50%;top:50%;font-size:14px;line-height:0;transform:translate(-50%,-50%)}
.kprev .k{display:block}
.sbbgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbbgs button{position:relative;aspect-ratio:3/4;border:2px solid transparent;border-radius:8px;padding:0;box-shadow:0 0 0 1px var(--line)}
.sbbgs button.on{border-color:var(--accent)}
.sbbgs span{position:absolute;left:0;right:0;bottom:0;padding:2px 0;font-size:11px;background:rgba(255,255,255,.85);color:var(--ink);border-radius:0 0 6px 6px}
.sbpool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sbpool button{aspect-ratio:1;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--chip)}
.sbpool img,.sbpool .cpic img{width:100%;height:100%;object-fit:cover;display:block}
.sbpool .cpic{display:block;width:100%;height:100%}
.sbpool .cpic svg{width:100%;height:100%}
.sbpanel .msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1em}
.sbpanel .msg.err{color:#B5473A}
.sbpanel .hint{font-size:12px;color:var(--muted)}
.sbpanel textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical}

/* 剪貼簿：翻閱（翻頁動畫） */
.bktitle{flex:1;text-align:center;font-size:15px}
.bkstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 16px;overflow:hidden;touch-action:pan-y}
.book{position:relative;display:flex;perspective:2400px}
.book .leafpos{width:var(--pw)}
.book .sbpage{width:100%}
.book.spread .leafpos:first-child .sbpage,.leaf.left .face .sbpage{border-radius:6px 0 0 6px}
.book.spread .leafpos:nth-child(2) .sbpage,.leaf.right .face .sbpage{border-radius:0 6px 6px 0}
.book.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:56px;transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.14),transparent)}
.leaf{position:absolute;top:0;width:var(--pw);height:calc(var(--pw) * 4 / 3);transform-style:preserve-3d;z-index:4;
  transition:transform .7s cubic-bezier(.3,.1,.2,1),opacity .7s ease-in}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf.single{left:0;transform-origin:left center}
.leaf.single.go-next.turn{transform:rotateY(-105deg);opacity:0}
.leaf.single.go-prev{transform:rotateY(-105deg);opacity:0}
.leaf.single.go-prev.turn{transform:rotateY(0);opacity:1}
.leaf.right{left:var(--pw);transform-origin:left center}
.leaf.right.turn{transform:rotateY(-180deg)}
.leaf.left{left:0;transform-origin:right center}
.leaf.left.turn{transform:rotateY(180deg)}
.bknav{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px 14px}
.bknav>button:not(.btn){width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;box-shadow:0 1px 4px rgba(59,47,47,.12)}
.bknav>button:not(.btn) svg{width:22px;height:22px}
.bknav>button:disabled{opacity:.35}
.bknav .btn{padding:10px 14px}

/* 分享／存成圖片 */
.sheet.share .sbchips button{font-size:13px;padding:7px 12px}
.shprev{margin-top:12px;text-align:center}
.shprev img{max-width:100%;max-height:36vh;border-radius:8px;box-shadow:0 4px 16px rgba(59,47,47,.15);background:var(--chip)}
.shprev img:not([src]){display:none}
.shprev .msg{margin-top:8px}


/* quiz */
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-bottom:16px}
.prog b{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-size:20px;font-weight:700;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;font-weight:600}
.opt.ok{border-color:var(--sage);background:#E3EFEA}
.opt.no{border-color:var(--accent);background:var(--accent-tint)}
.score{font-size:56px;font-weight:800;text-align:center;color:var(--accent)}
.res{text-align:center;color:var(--muted);margin:6px 0 16px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs div{display:flex;width:100%;max-width:480px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
/* letter */
.letter{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 16px;width:100%;border:0;text-align:left;font:inherit;color:inherit}
button.letter{cursor:pointer}
.letter .env{width:56px;height:44px;display:block}
.letter .t{font-weight:700}
.letter .meta{font-size:13px;color:var(--muted);margin-top:2px}
.letter .meta b{color:var(--accent)}
.modal .paper{background:#FFFCF7;max-height:82vh;overflow:auto;padding:24px 22px 20px}
.paper .to{color:var(--muted);font-size:14px}
.paper h3{font-size:20px;margin-top:4px}
.paper .lt{white-space:pre-wrap;line-height:1.9;margin-top:14px}
.paper .sign{text-align:right;color:var(--muted);margin-top:18px}
.paper .btn{width:100%;margin-top:18px}
/* backup */
.bk p{font-size:14px}
.bk .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bk textarea{font:inherit;font-size:16px;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);resize:vertical;min-height:84px;word-break:break-all}
.bk .btn.full{width:100%;margin-top:8px}
.bk .msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1em}
/* celebrate */
.celebrate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.celebrate .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--accent-tint),transparent 65%)}
.celebrate .conf{position:absolute;inset:0;pointer-events:none}
.celebrate .conf i{position:absolute;display:block;width:12px;height:12px;animation:fall var(--d) linear var(--dl) infinite}
.celebrate .conf svg{width:100%;height:100%;display:block}
@keyframes fall{from{top:-6%;transform:rotate(0)}to{top:104%;transform:rotate(var(--r))}}
.cel{position:relative;z-index:1;text-align:center;max-width:340px;width:100%;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.cel .petsvg{width:170px;height:170px;cursor:default}
.cel .kicker{font-size:13px;color:var(--muted);letter-spacing:.12em;margin-top:6px}
.cel h2{font-size:36px;font-weight:800;color:var(--accent);margin-top:4px;line-height:1.2}
.cel .sub{margin-top:10px;font-size:15px}
.cel .sub b{color:var(--accent)}
.cel .btn{margin-top:26px;min-width:160px}
.cel .btn.ghost{margin-top:10px}
.credit{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <section id="tab-home"></section>

  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>首頁</button>

  <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>問答</button>

<script src="config.js"></script>
<script>
/* 所有客人資料都在 config.js（window.CONFIG）。本檔只有結構與程式，交付時不用改。 */
/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const DAY = 86400000;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// 日期一律用「本地時間的午夜」；天數差用 UTC 日序號相減，不受時區與日光節約影響
function isYmd(s){
  if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d]=s.split('-').map(Number), t=new Date(y,m-1,d);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;
}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dayNum(d){return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);}
function diffDays(a,b){return dayNum(a)-dayNum(b);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
// 某年的週年日；2/29 在非閏年顯示在 2/28
function occurrence(base,y){
  let m=base.getMonth(), d=base.getDate();
  if(m===1&&d===29&&!isLeap(y)) d=28;
  return new Date(y,m,d);
}

function rgbHex(a){return "#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("").toUpperCase();}
function mix(h,to,t){const a=hexRgb(h),b=hexRgb(to);return rgbHex(a.map((v,i)=>v+(b[i]-v)*t));}

function lum(h){

  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}

/* ---------------- 日期計算 ---------------- */
function daysTogether(){return diffDays(today0(),START)+1;}   // startDate 在未來時會 <= 0

// 計算一筆日期的狀態
function evalDate(e){
  const now=today0(), base=parseDate(e.date);
  if(e.repeat==="yearly"){
    let y=Math.max(now.getFullYear(),base.getFullYear());
    let occ=occurrence(base,y);
    if(diffDays(occ,now)<0){y++;occ=occurrence(base,y);}
    const nth=y-base.getFullYear();
    const tag=nth>0?(e.type==="birthday"?nth+" 歲":(e.type==="anniversary"?nth+" 週年":"")):"";
    return {kind:"future",days:diffDays(occ,now),on:occ,tag};
  }
  const dd=diffDays(base,now);
  return dd>=0?{kind:"future",days:dd,on:base,tag:""}:{kind:"past",days:-dd,on:base,tag:""};
}
function nextHundred(){
  const n=daysTogether();
  const k=Math.max(1,Math.ceil(n/100));
  const target=100*k;
  const on=addDays(START,target-1);
  return {label:"第 "+target+" 天",days:diffDays(on,today0()),on,type:"milestone",repeat:"once"};
}
function allDates(){
  const custom=store.get("ourdays_custom",[]).filter(c=>c&&isYmd(c.date)).map(c=>Object.assign({custom:true},c));
  const list=CONFIG.dates.concat(custom).map(e=>Object.assign({},e,{st:evalDate(e)}));
  const m=nextHundred();
  list.push({label:m.label+" 紀念",date:"",type:"milestone",repeat:"once",st:{kind:"future",days:m.days,on:m.on,tag:""}});
  return list;
}
function todayEvents(){return allDates().filter(e=>e.st.kind==="future"&&e.st.days===0&&e.type!=="other");}
function typeName(t){return {birthday:"生日",anniversary:"紀念日",milestone:"里程碑",other:"日子"}[t]||"日子";}

// 依離開的時間補算數值下降（開啟頁面、還原備份時都會跑）
function settlePet(){
  const now=Date.now();
  if(!pet||typeof pet.t!=="number"||typeof pet.sat!=="number"||typeof pet.mood!=="number"){pet={sat:70,mood:70,t:now};}
  else{
    const h=Math.max(0,(now-pet.t)/3600000);
    pet.sat=Math.max(15,Math.min(100,pet.sat-3*h));
    pet.mood=Math.max(15,Math.min(100,pet.mood-2*h));
    pet.t=now;
  }
  store.set(PET_KEY,pet);
}

  else if(a==="touch"){pet.mood=Math.min(100,pet.mood+12);saying=petSay("touch");setTemp("happy");}
  else if(a==="play"){
    if(pet.sat<20){saying=petSay("needfood");petTemp=null;}
    else{pet.mood=Math.min(100,pet.mood+18);pet.sat=Math.max(15,pet.sat-8);saying=petSay("play");setTemp("happy");}

  renderPet();
  const sv=$("#petsvg"); if(sv){sv.classList.remove("bounce");void sv.getBoundingClientRect();sv.classList.add("bounce");}

function celebrateTitle(e){
  if(e.type==="birthday") return "生日快樂";
  if(e.type==="milestone") return "在一起"+e.label.replace(/\s*紀念$/,"");
  return "紀念日快樂";
}
function showCelebration(events,letters){
  letters=letters||[];
  if((!events.length&&!letters.length)||document.querySelector(".celebrate")) return;
  const cols=[THEME.accent,"#8FB8A8","#F4B860",THEME.soft];
  let conf="";
  for(let i=0;i<24;i++){
    const shape=i%3===0?HEART:(i%3===1?'<svg viewBox="0 0 10 10"><rect width="10" height="6" rx="1.5" fill="currentColor"/></svg>':'<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>');
    conf+=`<i style="left:${(i*41+7)%96}%;top:${(i*29+11)%92}%;color:${cols[i%4]};--d:${5+(i%5)}s;--dl:-${(i*0.73).toFixed(2)}s;--r:${i%2?360:-300}deg">${shape}</i>`;
  }
  const lines=events.map(e=>`<p class="sub">今天是「${esc(e.label)}」${e.st.tag?` ・ <b>${esc(e.st.tag)}</b>`:""}</p>`).join("")
    +letters.map(i=>`<p class="sub">「${esc(CONFIG.letters[i].title)}」今天解鎖了</p>`).join("");
  const title=events.length?celebrateTitle(events[0]):"有一封信打開了";
  const el=document.createElement("div");
  el.className="celebrate"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","celTitle");
  el.innerHTML=`<div class="glow"></div><div class="conf" aria-hidden="true">${conf}</div>
    <div class="cel">
      ${petSVG({stage:stageOf(),face:"happy",hat:true,animal:overrideAnimal||CONFIG.pet.animal,id:false})}
      <p class="kicker">${fmt(today0())}</p>
      <h2 id="celTitle">${esc(title)}</h2>
      ${lines}
      ${letters.length?`<button class="btn" id="celLetter">打開信</button><br><button class="btn ghost" id="celClose">關閉</button>`:'<button class="btn" id="celClose">關閉</button>'}
    </div>`;
  const prevOverflow=document.body.style.overflow;
  const close=()=>{el.remove();document.body.style.overflow=prevOverflow;document.removeEventListener("keydown",onKey);};
  const onKey=e=>{if(e.key==="Escape")close();};
  el.querySelector("#celClose").addEventListener("click",close);
  if(letters.length) el.querySelector("#celLetter").addEventListener("click",()=>{close();openLetter(letters[0]);});
  document.addEventListener("keydown",onKey);
  document.body.style.overflow="hidden";
  document.body.appendChild(el);
  el.querySelector(letters.length?"#celLetter":"#celClose").focus();
}
function celebrateToday(){
  const ev=todayEvents().filter(e=>e.type==="birthday"||e.type==="anniversary"||e.type==="milestone");

  const letters=CONFIG.letters.map((l,i)=>diffDays(parseDate(l.unlockDate),today0())===0?i:-1).filter(i=>i>=0);

}

/* ---------------- 備份碼 ---------------- */
// 備份碼 = "OD1-" + base64url(JSON)。只在使用者手機上產生與讀取，不經過任何伺服器
const TYPES=["birthday","anniversary","other"];
function b64e(t){let bin="";new TextEncoder().encode(t).forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0)));}
function makeBackup(){
  return "OD1-"+b64e(JSON.stringify({v:1,pet,custom:store.get("ourdays_custom",[]),best:store.get("ourdays_best",0)}));
}
function readBackup(code){
  const m=/^OD1-([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g,""));
  if(!m) return null;
  try{
    const d=JSON.parse(b64d(m[1]));
    if(!d||d.v!==1) return null;
    const p=d.pet, num=v=>typeof v==="number"&&isFinite(v);
    return {
      pet:p&&num(p.sat)&&num(p.mood)&&num(p.t)?{sat:p.sat,mood:p.mood,t:Math.min(p.t,Date.now())}:null,
      custom:(Array.isArray(d.custom)?d.custom:[]).filter(c=>c&&typeof c.label==="string"&&isYmd(c.date))
        .map((c,i)=>({id:typeof c.id==="string"?c.id:"c"+Date.now()+i,label:c.label.slice(0,20),date:c.date,
          type:TYPES.includes(c.type)?c.type:"other",repeat:c.repeat==="yearly"?"yearly":"once"})),
      best:Number.isInteger(d.best)&&d.best>=0?d.best:0
    };
  }catch(e){return null;}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){try{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;}catch(_){return false;}}
}
function bindBackup(){
  const msg=t=>{$("#bkMsg").textContent=t;};
  $("#bkMake").addEventListener("click",()=>{
    pet.t=Date.now(); store.set(PET_KEY,pet);
    $("#bkCode").value=makeBackup(); $("#bkOut").classList.remove("hidden"); $("#bkIn").classList.add("hidden");
    msg("備份碼只代表這一刻的狀態，換手機前再產生一次最保險。");
  });
  $("#bkCopy").addEventListener("click",async()=>{
    const ok=await copyText($("#bkCode").value);
    if(!ok) $("#bkCode").select();
    msg(ok?"已複製，請貼到記事本或傳給自己保存。":"無法自動複製，請長按上面的文字手動複製。");
  });
  $("#bkLoad").addEventListener("click",()=>{$("#bkIn").classList.remove("hidden");$("#bkOut").classList.add("hidden");msg("");$("#bkPaste").focus();});
  $("#bkRestore").addEventListener("click",()=>{
    const d=readBackup($("#bkPaste").value);
    if(!d){msg("備份碼格式不對，請確認有完整貼上（OD1- 開頭）。");return;}
    if(!confirm("還原後會取代這支手機目前的寵物狀態和自己新增的日子，確定嗎？")) return;
    if(d.pet){pet=d.pet;settlePet();}
    store.set("ourdays_custom",d.custom);
    store.set("ourdays_best",Math.max(d.best,store.get("ourdays_best",0)));
    saying=null; renderDates(); renderHome(); renderQuiz();
    $("#bkMsg").textContent="還原完成。";
  });
}

function photoFail(img){img.outerHTML=photoHolder(img.dataset.src);}
function picHTML(m,i){

/* ---------------- 雲端相簿（雙方同步） ---------------- */
// config.js 有 cloud 設定才會啟用。配對碼只存在這支手機，不會出現在網頁或網址上。
// cloud.imported = true：賣家建立雲端時已把預設回憶匯入雲端，連上後就以雲端為準（可以編輯、刪除）。
const CLOUD_PHOTO_CACHE="ourdays-photos-v1";
const MAX_UPLOAD=580*1024;                    // 雲端上限 600KB，手機端壓到 580KB 以內
const SCENE_KEYS=["cafe","sunset","mountain","cake","movie","snow"];
const DEMO_CODE="DEMO-1314";
const cloudState={auth:null,list:[],usage:null,status:"idle",lastSync:0,busy:false};
const photoURLs={};

function cloudKey(){return "ourdays_cloud_"+CONFIG.cloud.space;}
function cloudLoad(){
  cloudState.auth=null; cloudState.list=[]; cloudState.usage=null; cloudState.status="idle"; cloudState.lastSync=0;
  if(!CONFIG.cloud) return;
  if(CONFIG.cloud.demo){demoCloud.seed();if(demoCloud.paired){cloudState.auth=demoCloud.paired;cloudState.list=demoCloud.list;cloudState.usage=demoCloud.usage();}return;}

function cloudURL(path){return CONFIG.cloud.api+"/api/s/"+CONFIG.cloud.space+path;}
function cloudFetch(path,opt){
  opt=opt||{};

  const headers={authorization:"Bearer "+(opt.code||(cloudState.auth&&cloudState.auth.code)||"")};
  if(opt.json) headers["content-type"]="application/json";
  return fetch(cloudURL(path),{method:opt.method||"GET",body:opt.body,headers});
}
function cloudErr(status,code){
  if(status===0) return "目前沒有網路，請稍後再試。";

    expired:"雲端相簿已到期，目前只能瀏覽。",photo_limit:"照片已經達到上限了。",memory_limit:"回憶數量已經達到上限了。",

    bad_text:"內容最多 200 個字。"})[code]||"發生問題，請稍後再試。";
}
async function readErr(res){let code="";try{code=(await res.json()).error;}catch(e){}return cloudErr(res.status,code);}
function saveCloudList(){if(!CONFIG.cloud.demo) store.set(cloudKey()+"_list",{memories:cloudState.list,usage:cloudState.usage});}
// 連上雲端、而且預設回憶已在雲端時，設定檔裡的回憶就不再重複顯示
function cloudOwnsAlbum(){return !!(CONFIG.cloud&&cloudState.auth&&(CONFIG.cloud.imported||CONFIG.cloud.demo));}

async function cloudSync(force){
  if(!CONFIG.cloud||!cloudState.auth||CONFIG.cloud.demo) return;
  if(!force&&Date.now()-cloudState.lastSync<10000) return;
  cloudState.lastSync=Date.now(); cloudState.status="syncing"; renderCloudStatus();
  try{
    const res=await cloudFetch("/memories");
    if(res.status===401||res.status===404){
      cloudState.status="idle"; cloudUnpair(true);
      renderCloudPanel(res.status===401?"配對碼已失效，請向賣家索取新的配對碼。":"找不到這個雲端相簿，請聯絡賣家。"); renderAlbumList(); return;
    }

// 照片讀取：先找手機上的快取，沒有才向雲端下載（同一張只會下載一次）
// 照片編輯後 id 不變，所以快取的鍵加上版本（照片更新時間）
function photoCacheOK(){return !CONFIG.cloud.demo&&window.isSecureContext&&typeof caches!=="undefined";}
function photoKey(m){return cloudURL("/photos/"+m.id)+"?v="+(m.photoAt||0);}
async function cloudPhotoURL(m){
  const k=m.id+":"+(m.photoAt||0);
  if(photoURLs[k]) return photoURLs[k];
  if(m.src) return m.src;                       // 示範模式：設定檔裡的照片
  let blob=null;
  if(photoCacheOK()){try{const hit=await (await caches.open(CLOUD_PHOTO_CACHE)).match(photoKey(m));if(hit) blob=await hit.blob();}catch(e){}}
  if(!blob){
    const res=await cloudFetch("/photos/"+m.id);
    if(!res.ok) throw new Error(res.status);
    blob=await res.blob();
    await cachePhoto(m,blob);
  }
  return photoURLs[k]=URL.createObjectURL(blob);
}
async function cachePhoto(m,blob){
  photoURLs[m.id+":"+(m.photoAt||0)]=URL.createObjectURL(blob);
  if(!photoCacheOK()) return;
  try{await (await caches.open(CLOUD_PHOTO_CACHE)).put(photoKey(m),new Response(blob,{headers:{"content-type":blob.type||"image/jpeg"}}));}catch(e){}
}
async function uncachePhotos(ms){
  if(!photoCacheOK()) return;
  try{const c=await caches.open(CLOUD_PHOTO_CACHE);await Promise.all(ms.map(m=>c.delete(photoKey(m))));}catch(e){}
}

// 在手機上壓縮：長邊最多 1600px、存成 JPEG，順便去掉拍攝地點等資訊
async function compressImage(file){
  let src, w0, h0, url=null;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"});w0=src.width;h0=src.height;}
  catch(e){
    url=URL.createObjectURL(file);
    src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("decode"));im.src=url;});
    w0=src.naturalWidth; h0=src.naturalHeight;
  }
  try{
    if(!w0||!h0) throw new Error("decode");
    for(const [edge,q] of [[1600,.82],[1600,.72],[1400,.68],[1200,.64],[1000,.6]]){
      const s=Math.min(1,edge/Math.max(w0,h0)), w=Math.max(1,Math.round(w0*s)), h=Math.max(1,Math.round(h0*s));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(src,0,0,w,h);
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
      cv.width=cv.height=0;
      if(blob&&blob.size<=MAX_UPLOAD) return blob;
    }
    throw new Error("toolarge");
  }finally{
    if(src&&src.close) src.close();
    if(url) URL.revokeObjectURL(url);
  }
}

    this.list=CONFIG.album.map((m,i)=>({id:"demo"+String(i).padStart(12,"0"),date:m.date,title:m.title,text:m.text||"",author:"",

  async handle(path,opt){
    const j=(d,s)=>new Response(JSON.stringify(d),{status:s||200,headers:{"content-type":"application/json"}});

    if(m&&method==="POST"){
      const f=opt.body, photo=f.get("photo");
      m.date=f.get("date"); m.title=f.get("title"); m.text=f.get("text")||""; m.crop=f.get("crop")||"";
      if(photo){m.hasPhoto=true;m.src="";m.photoAt=Date.now();this.photos[m.id]=photo;}
      else if(f.get("removePhoto")==="1"){m.hasPhoto=false;m.src="";delete this.photos[m.id];}
      return j({memory:Object.assign({},m),usage:this.usage()});
    }
    const mPh=/^\/photos\/(\w+)$/.exec(path);
    if(mPh&&this.photos[mPh[1]]) return new Response(this.photos[mPh[1]]);
    return j({error:"not_found"},404);
  }
};

/* ---------------- 照片位置（拖曳＋縮放） ---------------- */
// crop 存成「x,y,z」：x、y 是照片對準框的焦點（0～1），z 是縮放（1～4）
function parseCrop(c){
  const m=/^([\d.]+),([\d.]+),([\d.]+)$/.exec(typeof c==="string"?c:"");
  if(!m) return null;
  const x=+m[1], y=+m[2], z=+m[3];
  return x>=0&&x<=1&&y>=0&&y<=1&&z>=1&&z<=4?{x,y,z}:null;
}
function cropStr(c){return [c.x,c.y,c.z].map(v=>Math.round(v*1000)/1000).join(",");}
function cropStyle(c){
  const p=typeof c==="string"?parseCrop(c):c;
  if(!p) return "";
  const X=(p.x*100).toFixed(1)+"%", Y=(p.y*100).toFixed(1)+"%";
  return `object-position:${X} ${Y};transform:scale(${p.z});transform-origin:${X} ${Y}`;
}
// 在 box 裡用手指拖曳照片、兩指縮放（電腦可用滾輪）；state 會直接被修改
function attachCrop(box,img,state,onChange){
  const pts=new Map(); let pinch=null;
  const clamp=v=>Math.min(1,Math.max(0,v));
  const apply=()=>{img.style.cssText=cropStyle(state);if(onChange) onChange();};
  const overflow=()=>{
    const r=box.getBoundingClientRect(), nw=img.naturalWidth||r.width, nh=img.naturalHeight||r.height, k=Math.max(r.width/nw,r.height/nh);
    return {ox:nw*k-r.width,oy:nh*k-r.height,w:r.width,h:r.height};
  };
  box.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();try{box.setPointerCapture(e.pointerId);}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null;});
  box.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    e.stopPropagation();
    const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      const o=overflow(), kx=o.ox*state.z+(state.z-1)*o.w, ky=o.oy*state.z+(state.z-1)*o.h;
      if(kx>1) state.x=clamp(state.x-(e.clientX-prev.x)/kx);
      if(ky>1) state.y=clamp(state.y-(e.clientY-prev.y)/ky);
      apply();
    }else if(pts.size===2){
      const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(!pinch) pinch={d,z:state.z};
      state.z=Math.min(4,Math.max(1,pinch.z*d/Math.max(1,pinch.d))); apply();
    }
  });
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2) pinch=null;};
  box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
  box.addEventListener("wheel",e=>{e.preventDefault();state.z=Math.min(4,Math.max(1,state.z*(e.deltaY<0?1.08:1/1.08)));apply();},{passive:false});
  img.addEventListener("load",apply);
  apply();
  return apply;
}

async function cloudPair(){
  if(cloudState.busy) return;
  const code=$("#pairCode").value.trim(), who=$("#pairWho").value, msg=$("#pairMsg");
  if(code.replace(/[^0-9a-z]/gi,"").length<8){msg.className="msg err";msg.textContent="配對碼是 8 個英文或數字。";return;}
  cloudState.busy=true; $("#pairBtn").disabled=true; msg.className="msg"; msg.textContent="連接中…";
  try{
    const res=await cloudFetch("/login",{method:"POST",code});
    if(!res.ok){msg.className="msg err";msg.textContent=await readErr(res);return;}
    const d=await res.json();
    cloudState.auth={code,who}; cloudState.usage=d.usage;
    // 第一次連上：雲端還沒有設定時，把這支手機的設定帶上去；雲端已有設定就以雲端為準
    if(d.settings&&Object.keys(d.settings).length) setTimeout(()=>receiveCloudSettings(d.settings));
    else if(Object.keys(userSettings()).length) setTimeout(()=>saveUserSettings(userSettings()));
    if(CONFIG.cloud.demo){demoCloud.paired=cloudState.auth;cloudState.list=demoCloud.list;}
    else store.set(cloudKey(),cloudState.auth);
    renderCloudPanel(); renderAlbumList(); cloudSync(true);
  }catch(e){msg.className="msg err";msg.textContent=cloudErr(0);}
  finally{cloudState.busy=false;const b=$("#pairBtn");if(b) b.disabled=false;}
}
async function cloudSave(){
  if(cloudState.busy) return;
  const msg=$("#memMsg"), btn=$("#mSave"), ed=editing;
  const say=(t,err)=>{msg.className="msg"+(err?" err":"");msg.textContent=t;};
  const date=$("#mDate").value, title=$("#mTitle").value.trim(), text=$("#mText").value.trim(), file=$("#mPhoto").files[0];
  if(!isYmd(date)){say("請選日期。",true);return;}
  if(!title){say("請填標題。",true);return;}
  const us=cloudState.usage, addsPhoto=file&&!(ed&&ed.hasPhoto);
  if(addsPhoto&&us&&us.photos>=us.maxPhotos){say(cloudErr(409,"photo_limit"),true);return;}
  cloudState.busy=true; btn.disabled=true;
  try{
    let blob=null;
    if(file){
      say("正在壓縮照片…");
      try{blob=await compressImage(file);}
      catch(e){say("這張照片無法處理，請換一張，或先截圖再上傳。",true);return;}
    }
    say(ed?"儲存中…":"上傳中…");
    const fd=new FormData();
    fd.append("date",date); fd.append("title",title); fd.append("text",text);
    if(!ed) fd.append("author",whoName(cloudState.auth.who));
    if(blob) fd.append("photo",blob,"photo.jpg");
    else if(ed&&ed.hasPhoto&&!keepPhoto) fd.append("removePhoto","1");
    if(blob||keepPhoto) fd.append("crop",cropStr(formCrop));
    let res;
    try{res=await cloudFetch(ed?"/memories/"+ed.id:"/memories",{method:"POST",body:fd});}catch(e){say(cloudErr(0),true);return;}
    if(!res.ok){say(await readErr(res),true);if(res.status===403) cloudSync(true);return;}
    const d=await res.json();
    if(blob) await cachePhoto(d.memory,blob);
    if(ed&&ed.hasPhoto&&(blob||!keepPhoto)) uncachePhotos([ed]);
    if(CONFIG.cloud.demo) cloudState.list=demoCloud.list;
    else cloudState.list=[d.memory].concat(cloudState.list.filter(m=>m.id!==d.memory.id));
    cloudState.usage=d.usage; saveCloudList();
    closeForm(); renderCloudStatus(); renderAlbumList();
    say(ed?"已儲存修改，對方也會看到。":(CONFIG.cloud.demo?"已新增（示範模式不會上傳）。":"已新增！對方打開相簿就會看到。"));
  }finally{cloudState.busy=false;btn.disabled=false;}
}
async function cloudDelete(m,close){

function cloudPicHTML(m){

  }
  if(m.src) return `<img src="${esc(m.src)}" alt="${esc(m.title)}" loading="lazy" style="${cropStyle(m.crop)}">`;
  return `<div class="cpic" data-cid="${esc(m.id)}" data-v="${m.photoAt||0}" data-crop="${esc(parseCrop(m.crop)?m.crop:"")}">${photoHolder("載入中")}</div>`;

let picObserver=null;
function hydrate(root){
  const els=root.querySelectorAll(".cpic[data-cid]:not([data-done])");
  const load=el=>{
    el.dataset.done="1";
    cloudPhotoURL({id:el.dataset.cid,photoAt:+el.dataset.v}).then(u=>{el.innerHTML=`<img src="${u}" alt="" style="${cropStyle(el.dataset.crop)}">`;})
      .catch(()=>{el.innerHTML=photoHolder("暫時無法載入");});
  };
  if(!("IntersectionObserver" in window)){els.forEach(load);return;}
  if(!picObserver) picObserver=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){picObserver.unobserve(e.target);load(e.target);}}),{rootMargin:"300px"});
  els.forEach(el=>picObserver.observe(el));
}

const sbId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>"abcdefghijkmnpqrstuvwxyz23456789"[b%32]).join("");
const sbNum=(v,a,b,d)=>{v=+v;return Number.isFinite(v)?Math.min(b,Math.max(a,v)):d;};
const sbHex=(v,d)=>typeof v==="string"&&/^#[0-9a-fA-F]{6}$/.test(v)?v.toUpperCase():d;
const sbIn=(list,v,d)=>list.some(x=>x[0]===v)?v:d;

function sbMode(){
  if(PREVIEW) return "off";

// 版面資料可能來自另一支手機：每個欄位都過濾一次再顯示
function sbCleanItem(it){
  if(!it||typeof it!=="object") return null;
  const t=["photo","text","sticker"].includes(it.t)?it.t:null;
  if(!t) return null;
  const o={id:typeof it.id==="string"&&/^[a-z0-9]{1,16}$/.test(it.id)?it.id:sbId(),t,x:sbNum(it.x,-.2,1.2,.5),y:sbNum(it.y,-.2,1.2,.5),r:sbNum(it.r,-180,180,0)};
  if(t==="photo"){
    o.w=sbNum(it.w,.08,1.4,.5); o.h=sbNum(it.h,.08,1.8,.4);
    o.src=typeof it.src==="string"&&/^(a:[a-z0-9]{16}|m:[a-z0-9]{16}|u:photos\/[\w.-]+\.(jpe?g|png|webp))$/i.test(it.src)?it.src:"";
    o.crop=parseCrop(it.crop)?it.crop:""; o.border=sbIn(SB_BORDERS,it.border,"white"); o.bc=sbHex(it.bc,"#FFFFFF");
  }else if(t==="text"){
    o.text=String(it.text||"").slice(0,120); o.font=sbIn(SB_FONTS,it.font,"sans"); o.color=sbHex(it.color,"#3B2F2F");
    o.size=sbNum(it.size,.03,.3,.07); o.bold=!!it.bold;
  }else{
    o.k=SB_STK[it.k]?it.k:"love"; o.color=sbHex(it.color,THEME.accent); o.size=sbNum(it.size,.02,.4,.05);
  }
  return o;
}
function sbCleanPage(p,i){
  let d={}; try{d=typeof p.data==="string"?JSON.parse(p.data):(p.data||{});}catch(e){}
  return {id:String(p.id||""),title:String(p.title||"").slice(0,20),updatedAt:p.updatedAt||0,
    data:{v:2,bg:SB_BG[d.bg]?d.bg:"cream",o:sbNum(d.o,-1e9,1e9,i||0),items:(Array.isArray(d.items)?d.items:[]).slice(0,80).map(sbCleanItem).filter(Boolean)}};
}

/* ---------- 畫出頁面（DOM） ---------- */
function sbStyle(it){
  let s=`left:${(it.x*100).toFixed(2)}%;top:${(it.y*100).toFixed(2)}%;transform:translate(-50%,-50%) rotate(${it.r.toFixed(1)}deg);`;
  if(it.t==="photo") s+=`width:${(it.w*100).toFixed(2)}cqw;height:${(it.h*100).toFixed(2)}cqw;--bc:${it.bc};`;
  else if(it.t==="text") s+=`font-size:${(it.size*100).toFixed(2)}cqw;color:${it.color};font-family:${SB_FONT_CSS[it.font]};font-weight:${it.bold?800:(it.font==="round"?600:400)};`;
  else s+=`font-size:${(it.size*100).toFixed(2)}cqw;`;
  return s;
}
function sbItemHTML(it,live){
  const sel=live&&sb.sel===it.id, handles=sel&&!sb.crop&&!sbReadOnly()?'<i class="hd rs" data-h="rs"></i><i class="hd rt" data-h="rt"></i>':"";
  const cls=`si s-${it.t}${sel?" sel":""}${sel&&sb.crop?" cropping":""}`;
  if(it.t==="photo") return `<div class="${cls} b-${it.border}" data-id="${it.id}" style="${sbStyle(it)}"><div class="ph"><img data-src="${esc(it.src)}" alt="" style="${cropStyle(it.crop)}" draggable="false"></div>${handles}</div>`;
  if(it.t==="text") return `<div class="${cls}" data-id="${it.id}" style="${sbStyle(it)}">${esc(it.text)||"&nbsp;"}${handles}</div>`;
  return `<div class="${cls}" data-id="${it.id}" style="${sbStyle(it)}">${sbStickerSVG(it.k,it.color)}${handles}</div>`;
}
function sbPageHTML(page,live){
  return `<div class="sbpage bg-${page.data.bg}"${live?' id="sbPage"':""}>${page.data.items.map(it=>sbItemHTML(it,live)).join("")}</div>`;
}

async function sbPhotoURL(src){
  if(sbURLs[src]) return sbURLs[src];
  if(src.startsWith("u:")) return src.slice(2);
  if(src.startsWith("m:")){
    const id=src.slice(2), m=cloudState.list.find(x=>x.id===id)||(sbMode()==="demo"?demoCloud.list.find(x=>x.id===id):null);
    if(!m||!m.hasPhoto) throw new Error("gone");
    return cloudPhotoURL(m);
  }
  const id=src.slice(2);
  if(sbMode()==="demo"){if(!demoCloud.assets[id]) throw new Error("gone");return sbURLs[src]=URL.createObjectURL(demoCloud.assets[id]);}
  const key=cloudURL("/assets/"+id);
  let blob=null;
  if(photoCacheOK()){try{const hit=await (await caches.open(CLOUD_PHOTO_CACHE)).match(key);if(hit) blob=await hit.blob();}catch(e){}}
  if(!blob){
    const res=await cloudFetch("/assets/"+id);
    if(!res.ok) throw new Error(res.status);
    blob=await res.blob();
    if(photoCacheOK()){try{await (await caches.open(CLOUD_PHOTO_CACHE)).put(key,new Response(blob,{headers:{"content-type":blob.type||"image/jpeg"}}));}catch(e){}}
  }
  return sbURLs[src]=URL.createObjectURL(blob);
}
function sbHydrate(root){
  root.querySelectorAll(".s-photo img[data-src]:not([src])").forEach(img=>{
    const src=img.dataset.src;
    if(!src){img.closest(".ph").classList.add("empty");return;}
    sbPhotoURL(src).then(u=>{img.src=u;}).catch(()=>{img.closest(".ph").classList.add("empty");});
  });
}

/* ---------- 讀取與儲存 ---------- */
function sbCacheKey(){return sbMode()==="cloud"?cloudKey()+"_pages":SB_LOCAL_KEY;}
async function sbLoad(force){
  const mode=sbMode();
  if(mode==="off"||mode==="locked"){sb.pages=[];sb.loaded=true;return;}
  if(mode==="demo"){demoCloud.seedPages();sb.pages=demoCloud.pages.map(sbCleanPage);sbSort();sb.loaded=true;return;}
  if(!sb.loaded){sb.pages=(store.get(sbCacheKey(),[])||[]).map(sbCleanPage);sbSort();sb.loaded=true;}
  if(mode!=="cloud") return;
  if(!force&&Date.now()-sb.lastFetch<10000) return;
  sb.lastFetch=Date.now();
  try{
    const res=await cloudFetch("/pages");
    if(!res.ok) return;
    const d=await res.json();
    if(d.usage){cloudState.usage=d.usage;renderCloudStatus();}
    const fresh=d.pages.map(sbCleanPage);
    // 這支手機上還沒存的頁面保留手機上的版本
    sb.dirty.forEach(id=>{const i=fresh.findIndex(p=>p.id===id), mine=sb.pages.find(p=>p.id===id);if(i>=0&&mine) fresh[i]=mine;});
    if(sb.cur){const i=fresh.findIndex(p=>p.id===sb.cur.id);if(i>=0) fresh[i]=sb.cur;}
    sb.pages=fresh; sbSort(); store.set(sbCacheKey(),sb.pages.map(sbPayload));
  }catch(e){}
}
function sbSetStatus(t){const el=$("#sbStatus");if(el) el.textContent=t;}
function sbDirty(p){
  p=p||sb.cur; if(!p||sbReadOnly()) return;
  sb.dirty.add(p.id); sbSetStatus("未儲存");
  clearTimeout(sb.timer); sb.timer=setTimeout(sbFlush,1200);
}
async function sbSavePage(p){
  const mode=sbMode();
  if(mode==="demo"){const i=demoCloud.pages.findIndex(x=>x.id===p.id);if(i>=0) demoCloud.pages[i]=sbPayload(p);return {ok:true};}
  if(mode==="local"){store.set(SB_LOCAL_KEY,sb.pages.map(sbPayload));return {ok:true};}
  try{
    const res=await cloudFetch("/pages/"+p.id,{method:"POST",body:JSON.stringify({title:p.title,data:JSON.stringify(p.data)}),json:true});
    if(!res.ok) return {ok:false,msg:await readErr(res)};
    const d=await res.json(); if(d.usage){cloudState.usage=d.usage;renderCloudStatus();}
    store.set(sbCacheKey(),sb.pages.map(sbPayload));
    return {ok:true};
  }catch(e){return {ok:false,msg:"沒有網路，恢復連線後會再存"};}
}
async function sbFlush(){
  clearTimeout(sb.timer);
  if(sb.saving){sb.timer=setTimeout(sbFlush,400);return false;}
  if(!sb.dirty.size) return true;
  sb.saving=true; sbSetStatus("儲存中…");
  const ids=[...sb.dirty]; sb.dirty.clear();
  let msg="";
  for(const id of ids){
    const p=sb.pages.find(x=>x.id===id); if(!p) continue;
    const r=await sbSavePage(p);
    if(!r.ok){msg=r.msg;sb.dirty.add(id);} else p.updatedAt=Date.now();
  }
  sb.saving=false;
  sbSetStatus(msg||(sb.dirty.size?"未儲存":"已儲存"));
  return !msg;
}
window.addEventListener("online",()=>{if(sb.dirty.size) sbFlush();});
async function sbCreatePage(after){
  const mode=sbMode();
  const os=sb.pages.map(p=>p.data.o), i=after?sb.pages.indexOf(after):-1;
  // 插在指定頁的後面（排序值取兩頁中間）；沒指定就放最後
  const o=i>=0&&i<sb.pages.length-1?(os[i]+os[i+1])/2:(os.length?Math.max(...os)+1:0);
  const page={id:"",title:"",updatedAt:Date.now(),data:{v:2,bg:"cream",o,items:[
    sbCleanItem({t:"text",text:"我們的一天",x:.5,y:.12,r:-3,font:"kai",color:"#3B2F2F",size:.085,bold:true})]}};
  if(mode==="cloud"){
    try{
      const res=await cloudFetch("/pages",{method:"POST",body:JSON.stringify({title:"",data:JSON.stringify(page.data)}),json:true});
      if(!res.ok){alert(await readErr(res));return null;}
      const d=await res.json(); page.id=d.page.id;
    }catch(e){alert(cloudErr(0));return null;}
  }else page.id=sbId();
  sb.pages.push(page); sbSort();
  if(mode==="demo") demoCloud.pages.push(sbPayload(page));
  if(mode==="local"||mode==="cloud") store.set(sbCacheKey(),sb.pages.map(sbPayload));
  return page;
}
async function sbDeletePage(p){
  if(!p||!confirm("要刪除這一頁嗎？兩個人都會看不到，無法復原。")) return false;
  const mode=sbMode();
  if(mode==="cloud"){
    try{const res=await cloudFetch("/pages/"+p.id,{method:"DELETE"});if(!res.ok&&res.status!==404){alert(await readErr(res));return false;}
      const d=await res.json().catch(()=>({}));if(d.usage){cloudState.usage=d.usage;renderCloudStatus();}}
    catch(e){alert(cloudErr(0));return false;}
  }
  if(mode==="demo") demoCloud.pages=demoCloud.pages.filter(x=>x.id!==p.id);
  sb.pages=sb.pages.filter(x=>x.id!==p.id); sb.dirty.delete(p.id);
  if(mode==="local"||mode==="cloud") store.set(sbCacheKey(),sb.pages.map(sbPayload));
  return true;
}
// 調整頁面順序：和前一頁（-1）或後一頁（+1）交換
function sbMovePage(p,dir){
  const i=sb.pages.indexOf(p), j=i+dir;
  if(i<0||j<0||j>=sb.pages.length) return;
  const q=sb.pages[j], t=p.data.o; p.data.o=q.data.o; q.data.o=t;
  if(p.data.o===q.data.o) p.data.o+=dir*.001;
  sbSort(); sbDirty(p); sbDirty(q);
}

/* ---------- 翻閱（像翻剪貼簿一樣） ---------- */
const bk={i:0,spread:false,busy:false};
const sbReduce=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function sbBlankPage(){return '<div class="sbpage bg-cream blank"></div>';}
function sbOpenBook(i){
  if(!sb.pages.length) return;
  const el=document.createElement("div");
  el.className="sbbook"; el.id="sbBook"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","翻閱剪貼簿");
  el.innerHTML=`<div class="sbtop"><button class="btn ghost" id="bkClose">關閉</button><b class="bktitle">我們的剪貼簿</b><span class="sbstatus" id="bkNum"></span></div>
    <div class="bkstage" id="bkStage"><div class="book" id="bookEl"></div></div>
    <div class="bknav">
      <button id="bkPrev" aria-label="上一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn ghost" id="bkShare">分享／存圖</button>${sbReadOnly()?"":'<button class="btn ghost" id="bkEdit">編輯這頁</button>'}
      <button id="bkNext" aria-label="下一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>`;
  document.body.appendChild(el); document.body.style.overflow="hidden";
  bk.i=i; bk.busy=false;
  const close=()=>{el.remove();document.body.style.overflow="";document.removeEventListener("keydown",onKey);window.removeEventListener("resize",bkLayout);};
  const onKey=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")bkGo(1);if(e.key==="ArrowLeft")bkGo(-1);};
  document.addEventListener("keydown",onKey); window.addEventListener("resize",bkLayout);
  $("#bkClose").addEventListener("click",close);
  $("#bkPrev").addEventListener("click",()=>bkGo(-1));
  $("#bkNext").addEventListener("click",()=>bkGo(1));
  $("#bkShare").addEventListener("click",()=>sbShareSheet(bk.i));
  const ed=$("#bkEdit"); if(ed) ed.addEventListener("click",()=>{const p=sb.pages[bk.i];close();sbOpen(p.id);});
  // 左右滑動翻頁
  const st=$("#bkStage"); let sx=null, sy=null;
  st.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;});
  st.addEventListener("pointerup",e=>{
    if(sx===null) return;
    const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)) bkGo(dx<0?1:-1);
  });
  bkLayout();
}
function bkLayout(){
  const st=$("#bkStage"), book=$("#bookEl"); if(!st||!book) return;
  const W=st.clientWidth-32, H=st.clientHeight-24;
  bk.spread=W>=600&&W/H>1.1;
  if(bk.spread) bk.i-=bk.i%2;
  const pw=Math.max(120,Math.min(bk.spread?W/2:W,H*.75));
  book.style.setProperty("--pw",pw+"px");
  bkRender();
}
function bkPagesAt(i){return bk.spread?[sb.pages[i],sb.pages[i+1]]:[sb.pages[i]];}
function bkRender(){
  const book=$("#bookEl"); if(!book) return;
  book.className="book"+(bk.spread?" spread":"");
  book.innerHTML=bkPagesAt(bk.i).map(p=>`<div class="leafpos">${p?sbPageHTML(p,false):sbBlankPage()}</div>`).join("");
  sbHydrate(book);
  const n=sb.pages.length, last=bk.spread?bk.i+1:bk.i;
  $("#bkNum").textContent=bk.spread?`${bk.i+1}${bk.i+1<n?"–"+Math.min(n,bk.i+2):""} / ${n}`:`${bk.i+1} / ${n}`;
  $("#bkPrev").disabled=bk.i<=0; $("#bkNext").disabled=last>=n-1;
}
// 翻頁動畫：一張「頁」繞著書脊轉過去
function bkGo(dir){
  const n=sb.pages.length, step=bk.spread?2:1, to=bk.i+dir*step;
  if(bk.busy||to<0||to>n-1) return;
  if(sbReduce()){bk.i=to;bkRender();return;}
  const book=$("#bookEl"), P=i=>sb.pages[i]?sbPageHTML(sb.pages[i],false):sbBlankPage();
  bk.busy=true;
  let under, leaf;
  if(!bk.spread){
    under=`<div class="leafpos">${P(dir>0?to:bk.i)}</div>`;
    leaf=`<div class="leaf single ${dir>0?"go-next":"go-prev"}"><div class="face">${P(dir>0?bk.i:to)}</div></div>`;
  }else if(dir>0){
    under=`<div class="leafpos">${P(bk.i)}</div><div class="leafpos">${P(to+1)}</div>`;
    leaf=`<div class="leaf right go-next"><div class="face">${P(bk.i+1)}</div><div class="face back">${P(to)}</div></div>`;
  }else{
    under=`<div class="leafpos">${P(to)}</div><div class="leafpos">${P(bk.i+1)}</div>`;
    leaf=`<div class="leaf left go-prev"><div class="face">${P(bk.i)}</div><div class="face back">${P(to+1)}</div></div>`;
  }
  book.innerHTML=under+leaf; sbHydrate(book);
  const lf=book.querySelector(".leaf");
  requestAnimationFrame(()=>requestAnimationFrame(()=>lf.classList.add("turn")));
  let done=false;
  const finish=()=>{if(done) return;done=true;bk.i=to;bk.busy=false;bkRender();};
  lf.addEventListener("transitionend",finish); setTimeout(finish,900);
}

function sbTool(key,label,act){return `<button data-act="${act}">${sbSvg(key)}${label}</button>`;}
function sbItem(){return sb.cur&&sb.cur.data.items.find(i=>i.id===sb.sel);}

function sbOpen(id){
  const p=sb.pages.find(x=>x.id===id); if(!p) return;
  sb.cur=p; sb.sel=null; sb.crop=false; sb.mode="select"; sb.view={s:1,x:0,y:0};

      <span class="sbstatus" id="sbStatus" role="status"></span>

      <div class="sbzoom"><button data-z="out" aria-label="縮小畫面">−</button><button data-z="reset" id="sbZoomLbl" aria-label="畫面回到 100%">100%</button><button data-z="in" aria-label="放大畫面">＋</button></div>

async function sbClose(){
  await sbFlush();
  if(sb.ro){sb.ro.disconnect();sb.ro=null;}
  const el=$("#sbEdit"); if(el) el.remove();
  document.body.style.overflow="";
  sb.cur=null; sb.sel=null; sb.crop=false;
  renderScrapList();
}
// 兩種模式：選取（拖曳物件）、移動畫面（拖曳＝移動鏡頭、兩指＝放大縮小，不會動到物件）
function sbSetMode(m){
  sb.mode=m==="pan"?"pan":"select";
  document.querySelectorAll("#sbEdit .sbmode button").forEach(b=>{const on=b.dataset.m===sb.mode;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});
  $("#sbStage").classList.toggle("panmode",sb.mode==="pan");
  if(sb.mode==="pan"&&(sb.sel||sb.crop)){sb.sel=null;sb.crop=false;sbPanel(null);sbRender();}
}
function sbApplyView(){
  const page=$("#sbPage"); if(!page) return;
  const v=sb.view;
  page.style.transform=`translate(${v.x.toFixed(1)}px,${v.y.toFixed(1)}px) scale(${v.s.toFixed(3)})`;
  page.style.setProperty("--vz",v.s.toFixed(3));
  const l=$("#sbZoomLbl"); if(l) l.textContent=Math.round(v.s*100)+"%";
}
// 讓頁面中心不會被拖出編輯區
function sbClampView(){
  const page=$("#sbPage"), hold=$("#sbHold"); if(!page||!hold) return;
  const v=sb.view, w=page.offsetWidth*v.s, h=page.offsetHeight*v.s;
  const minX=-page.offsetLeft-w/2+40, maxX=hold.clientWidth-page.offsetLeft-w/2-40;
  const minY=-page.offsetTop-h/2+40, maxY=hold.clientHeight-page.offsetTop-h/2-40;
  v.x=Math.min(Math.max(v.x,Math.min(minX,maxX)),Math.max(minX,maxX));
  v.y=Math.min(Math.max(v.y,Math.min(minY,maxY)),Math.max(minY,maxY));
}
// 以螢幕上的某一點為中心縮放畫面
function sbZoomAt(cx,cy,k,base){
  const page=$("#sbPage"), hold=$("#sbHold"); if(!page) return;
  const v=sb.view, b=base||{s:v.s,x:v.x,y:v.y}, hr=hold.getBoundingClientRect();
  const lx=cx-hr.left-page.offsetLeft, ly=cy-hr.top-page.offsetTop;
  const s=Math.min(4,Math.max(.6,b.s*k));
  const px=(lx-b.x)/b.s, py=(ly-b.y)/b.s;
  v.s=s; v.x=lx-s*px; v.y=ly-s*py;
  sbClampView(); sbApplyView();
}
function sbViewReset(){sb.view={s:1,x:0,y:0};sbApplyView();}
function sbRender(){
  const hold=$("#sbHold"); if(!hold||!sb.cur) return;
  hold.innerHTML=sbPageHTML(sb.cur,true);
  sbFit(); sbApplyView(); sbHydrate(hold);
  const it=sbItem();
