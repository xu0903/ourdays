/* ---------- 手勢：拖曳、縮放、旋轉、移動畫面 ---------- */
function sbBindStage(){
  const stage=$("#sbStage");
  const pts=new Map();
  let g=null, raf=0, lastTap=0;
  const pageRect=()=>$("#sbPage").getBoundingClientRect();
  const center=(it,r)=>({x:r.left+it.x*r.width,y:r.top+it.y*r.height});
  const sizeOf=it=>it.t==="photo"?{w:it.w,h:it.h}:{size:it.size};
  const two=()=>{const [a,b]=[...pts.values()];return {a,b,d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,ang:Math.atan2(b.y-a.y,b.x-a.x)};};
  // 每個畫面更新只畫一次，拖曳比較順
  const paint=()=>{raf=0;if(!g) return;
    if(g.it){const el=document.querySelector(`#sbPage .si[data-id="${g.it.id}"]`);if(el) el.style.cssText=sbStyle(g.it);}
    else sbApplyView();
  };
  const schedule=()=>{if(!raf) raf=requestAnimationFrame(paint);};
  stage.addEventListener("pointerdown",e=>{
    if(!sb.cur||e.target.closest(".sbmode,.sbzoom")) return;
    e.preventDefault();
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      const t=two();
      // 第二根手指：選取模式下正在拖物件 → 縮放＋旋轉物件；其他情況 → 縮放畫面
      if(g&&g.it&&sb.mode==="select") g={mode:"pinch",it:g.it,d:t.d,ang:t.ang,r0:g.it.r,s0:sizeOf(g.it)};
      else g={mode:"vpinch",d:t.d,mx:t.mx,my:t.my,base:{...sb.view}};
      return;
    }
    if(pts.size>2) return;
    const el=e.target.closest(".si"), page=$("#sbPage");
    const onItem=sb.mode==="select"&&!sbReadOnly()&&el&&page&&page.contains(el);
    if(!onItem){
      // 空白處（或移動畫面模式）：拖曳＝移動畫面；輕點＝取消選取；連點兩下＝回到 100%
      const now=Date.now();
      if(now-lastTap<300){sbViewReset();lastTap=0;}else lastTap=now;
      g={mode:"vpan",x0:sb.view.x,y0:sb.view.y,px:e.clientX,py:e.clientY,moved:false};
      return;
    }
    if(sb.crop&&el.dataset.id===sb.sel) return;   // 裁切中：交給照片自己的拖曳
    const it=sb.cur.data.items.find(i=>i.id===el.dataset.id); if(!it) return;
    if(sb.sel!==it.id||sb.crop){sb.sel=it.id;sb.crop=false;sbPanel(null);sbRender();}
    const r=pageRect(), h=e.target.dataset.h;
    if(h==="rs"){const c=center(it,r);g={mode:"resize",it,c,d0:Math.hypot(e.clientX-c.x,e.clientY-c.y),s0:sizeOf(it)};}
    else if(h==="rt") g={mode:"rotate",it,c:center(it,r)};
    else g={mode:"move",it,x0:it.x,y0:it.y,px:e.clientX,py:e.clientY,moved:false};
  });
  stage.addEventListener("pointermove",e=>{
    if(!g||!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const it=g.it;
    if(g.mode==="vpan"&&pts.size===1){
      const dx=e.clientX-g.px, dy=e.clientY-g.py;
      if(Math.abs(dx)+Math.abs(dy)>4) g.moved=true;
      if(sb.view.s===1&&sb.mode==="select") return;   // 沒放大時，選取模式不移動畫面
      sb.view.x=g.x0+dx; sb.view.y=g.y0+dy; sbClampView();
    }else if(g.mode==="vpinch"&&pts.size===2){
      const t=two();
      sbZoomAt(g.mx,g.my,t.d/Math.max(1,g.d),g.base);
      sb.view.x+=t.mx-g.mx; sb.view.y+=t.my-g.my; sbClampView();
    }else if(g.mode==="move"&&pts.size===1){
      const r=pageRect();
      it.x=sbNum(g.x0+(e.clientX-g.px)/r.width,-.2,1.2,it.x); it.y=sbNum(g.y0+(e.clientY-g.py)/r.height,-.2,1.2,it.y);
      g.moved=true;
    }else if(g.mode==="rotate"){
      let a=Math.atan2(e.clientY-g.c.y,e.clientX-g.c.x)*180/Math.PI+90;
      if(a>180) a-=360;
      if(Math.abs(a)<4) a=0;   // 接近水平時吸附
      it.r=a;
    }else if(g.mode==="resize"){
      const r=pageRect();
      if(it.t==="photo"){
        // 把手指位置轉到照片自己的座標（考慮旋轉），算出新的寬高
        const dx=e.clientX-g.c.x, dy=e.clientY-g.c.y, rad=-it.r*Math.PI/180;
        const lx=dx*Math.cos(rad)-dy*Math.sin(rad), ly=dx*Math.sin(rad)+dy*Math.cos(rad);
        it.w=sbNum(2*Math.abs(lx)/r.width,.08,1.4,it.w); it.h=sbNum(2*Math.abs(ly)/r.width,.08,1.8,it.h);
      }else{
        const d=Math.hypot(e.clientX-g.c.x,e.clientY-g.c.y);
        it.size=sbNum(g.s0.size*d/Math.max(1,g.d0),.02,it.t==="text"?.3:.4,it.size);
      }
    }else if(g.mode==="pinch"&&pts.size===2){
      const t=two(), k=t.d/Math.max(1,g.d);
      let r=Math.round((g.r0+(t.ang-g.ang)*180/Math.PI)*10)/10; if(r>180) r-=360; if(r<-180) r+=360;
      it.r=r;
      if(it.t==="photo"){it.w=sbNum(g.s0.w*k,.08,1.4,it.w);it.h=sbNum(g.s0.h*k,.08,1.8,it.h);}
      else it.size=sbNum(g.s0.size*k,.02,it.t==="text"?.3:.4,it.size);
    }else return;
    schedule();
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(!g) return;
    if(pts.size===1&&(g.mode==="pinch"||g.mode==="vpinch")){if(g.it) sbDirty();g={mode:"done"};return;}
    if(pts.size) return;
    if(raf){cancelAnimationFrame(raf);paint();}
    if(g.mode==="vpan"&&!g.moved&&sb.mode==="select"&&(sb.sel||sb.crop)){sb.sel=null;sb.crop=false;sbPanel(null);sbRender();}
    else if(g.it&&(g.mode!=="move"||g.moved)) sbDirty();
    g=null;
  };
  stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
  // 電腦：滾輪縮放（選取物件時縮放物件，否則縮放畫面）
  stage.addEventListener("wheel",e=>{
    if(!sb.cur) return;
    e.preventDefault();
    const k=e.deltaY<0?1.08:1/1.08, it=sbItem();
    if(it&&sb.mode==="select"&&!sb.crop&&!sbReadOnly()){
      if(it.t==="photo"){it.w=sbNum(it.w*k,.08,1.4,it.w);it.h=sbNum(it.h*k,.08,1.8,it.h);}
      else it.size=sbNum(it.size*k,.02,it.t==="text"?.3:.4,it.size);
      sbRefreshItem(it); sbDirty();
    }else if(!sb.crop) sbZoomAt(e.clientX,e.clientY,k);
  },{passive:false});
}

/* ---------- 存成圖片（canvas 照著同一份資料畫） ---------- */
const sbImgCache=new Map();
function sbLoadImg(src){
  if(sbImgCache.has(src)) return sbImgCache.get(src);
  const p=new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("img"));im.src=src;});
  sbImgCache.set(src,p); p.catch(()=>sbImgCache.delete(src));
  return p;
}
function sbRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// 和畫面上的 object-fit:cover + object-position + scale 一樣的取景
function sbDrawCover(ctx,img,x,y,w,h,c){
  const nw=img.naturalWidth||img.width, nh=img.naturalHeight||img.height, k=Math.max(w/nw,h/nh), rw=nw*k, rh=nh*k;
  const ox=(w-rw)*c.x, oy=(h-rh)*c.y, px=w*c.x, py=h*c.y;
  ctx.drawImage(img,x+px+(ox-px)*c.z,y+py+(oy-py)*c.z,rw*c.z,rh*c.z);
}
async function sbDrawPhoto(ctx,it,W){
  const u=W/100, w=it.w*W, h=it.h*W, x=-w/2, y=-h/2, bc=it.bc;
  let img=null; try{img=await sbLoadImg(await sbPhotoURL(it.src));}catch(e){}
  const crop=parseCrop(it.crop)||{x:.5,y:.5,z:1};
  const pic=(px,py,pw,ph,shape)=>{
    ctx.save();
    if(shape==="round") sbRoundRect(ctx,px,py,pw,ph,3.8*u);
    else if(shape==="circle"){ctx.beginPath();ctx.ellipse(px+pw/2,py+ph/2,pw/2,ph/2,0,0,Math.PI*2);}
    else{ctx.beginPath();ctx.rect(px,py,pw,ph);}
    ctx.clip();
    if(img) sbDrawCover(ctx,img,px,py,pw,ph,crop);
    else{ctx.fillStyle="#EDE4DA";ctx.fillRect(px,py,pw,ph);}
    ctx.restore();
  };
  const shadow=(oy,blur,col)=>{ctx.shadowColor=col;ctx.shadowOffsetY=oy;ctx.shadowBlur=blur;};
  const noShadow=()=>{ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;};
  ctx.fillStyle=bc;
  switch(it.border){
    case "white": ctx.fillRect(x,y,w,h); pic(x+1.4*u,y+1.4*u,w-2.8*u,h-2.8*u); break;
    case "polaroid": shadow(.6*u,2*u,"rgba(0,0,0,.16)"); ctx.fillRect(x,y,w,h); noShadow(); pic(x+1.8*u,y+1.8*u,w-3.6*u,h-8.8*u); break;
    case "round": sbRoundRect(ctx,x,y,w,h,5*u); ctx.fill(); pic(x+1.2*u,y+1.2*u,w-2.4*u,h-2.4*u,"round"); break;
    case "circle": ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); ctx.fill(); pic(x+1.2*u,y+1.2*u,w-2.4*u,h-2.4*u,"circle"); break;
    case "shadow": shadow(1.6*u,4*u,"rgba(0,0,0,.28)"); ctx.fillStyle="#EDE4DA"; ctx.fillRect(x,y,w,h); noShadow(); pic(x,y,w,h); break;
    case "tape":{
      shadow(.6*u,1.6*u,"rgba(0,0,0,.12)"); ctx.fillStyle="#EDE4DA"; ctx.fillRect(x,y,w,h); noShadow(); pic(x,y,w,h);
      const tw=.32*w, th=5.5*u;
      [[x-.07*w+tw/2,y-2.6*u+th/2],[-x+.07*w-tw/2,-y+2.6*u-th/2]].forEach(([cx,cy])=>{
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(-32*Math.PI/180); ctx.globalAlpha=.8; ctx.fillStyle=bc; ctx.fillRect(-tw/2,-th/2,tw,th); ctx.restore();
      });
      break;
    }
    default: pic(x,y,w,h);
  }
}
function sbDrawText(ctx,it,W){
  const fs=it.size*W, lines=it.text.split("\n");
  ctx.font=`${it.bold?800:(it.font==="round"?600:400)} ${fs}px ${SB_FONT_CSS[it.font]}`;
  ctx.fillStyle=it.color; ctx.textAlign="center"; ctx.textBaseline="middle";
  lines.forEach((ln,i)=>ctx.fillText(ln,0,(i-(lines.length-1)/2)*1.25*fs));
}
async function sbDrawPage(ctx,page,X,Y,W){
  const H=W*4/3;
  ctx.save(); ctx.beginPath(); ctx.rect(X,Y,W,H); ctx.clip();
  ctx.fillStyle=SB_BG[page.data.bg][1]; ctx.fillRect(X,Y,W,H);
  ctx.drawImage(await sbLoadImg(svgURL(sbBgSVG(page.data.bg))),X,Y,W,H);
  for(const it of page.data.items){
    ctx.save(); ctx.translate(X+it.x*W,Y+it.y*H); ctx.rotate(it.r*Math.PI/180);
    if(it.t==="photo") await sbDrawPhoto(ctx,it,W);
    else if(it.t==="text") sbDrawText(ctx,it,W);
    else{
      const d=SB_STK[it.k](it.color), img=await sbLoadImg(svgURL(sbStickerSVG(it.k,it.color,true)));
      const w=it.size*W*d.w/40, h=it.size*W*d.h/40;
      ctx.drawImage(img,-w/2,-h/2,w,h);
    }
    ctx.restore();
  }
  ctx.restore();
}
function sbMarkText(){return typeof CONFIG.exportMark==="string"?CONFIG.exportMark:CONFIG.title;}
function sbDrawMark(ctx,x,y,size,dark,align){
  const t=sbMarkText(); if(!t) return;
  ctx.save(); ctx.font=`600 ${size}px ${SB_FONT_CSS.sans}`; ctx.textAlign=align||"right"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=dark?"rgba(255,255,255,.7)":"rgba(59,47,47,.42)"; ctx.fillText(t,x,y); ctx.restore();
}
// kind：post 單頁 3:4、story 限時動態 9:16、spread 跨頁橫式、book 整本（每頁一張）
async function sbExport(kind,idx,mark){
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  const make=(w,h)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c;};
  const toFile=(c,name)=>new Promise((ok,no)=>c.toBlob(b=>b?ok(new File([b],name,{type:"image/jpeg"})):no(new Error("blob")),"image/jpeg",.92));
  const post=async(p,i)=>{
    const c=make(1080,1440), ctx=c.getContext("2d");
    await sbDrawPage(ctx,p,0,0,1080);
    if(mark) sbDrawMark(ctx,1040,1404,26,SB_DARK_BG.has(p.data.bg));
    return toFile(c,`ourdays-page${i+1}.jpg`);
  };
  if(kind==="book"){const out=[];for(let i=0;i<sb.pages.length;i++) out.push(await post(sb.pages[i],i));return out;}
  const p=sb.pages[idx];
  if(kind==="post") return [await post(p,idx)];
  if(kind==="story"){
    const c=make(1080,1920), ctx=c.getContext("2d");
    ctx.fillStyle=CONFIG.bg; ctx.fillRect(0,0,1080,1920);
    ctx.fillStyle="#3B2F2F"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
    ctx.font=`800 64px ${SB_FONT_CSS.kai}`; ctx.fillText(p.title||"我們的剪貼簿",540,200);
    ctx.save(); ctx.shadowColor="rgba(59,47,47,.18)"; ctx.shadowBlur=40; ctx.shadowOffsetY=16; ctx.fillStyle="#fff"; ctx.fillRect(90,270,900,1200); ctx.restore();
    await sbDrawPage(ctx,p,90,270,900);
    const n=daysTogether();
    ctx.fillStyle="#3B2F2F"; ctx.font=`700 44px ${SB_FONT_CSS.sans}`; ctx.textAlign="center";
    ctx.fillText(n>0?`${CONFIG.couple.a} & ${CONFIG.couple.b}・第 ${n} 天`:`${CONFIG.couple.a} & ${CONFIG.couple.b}`,540,1600);
    ctx.fillStyle="#8C7B72"; ctx.font=`500 32px ${SB_FONT_CSS.sans}`; ctx.fillText(fmt(today0()),540,1660);
    if(mark) sbDrawMark(ctx,540,1860,28,false,"center");
    return [await toFile(c,`ourdays-story${idx+1}.jpg`)];
  }
  // 跨頁：兩頁並排像一本攤開的書（第 1–2 頁、3–4 頁…）
  const L=idx-idx%2, W=1000, H=1333, c=make(2240,1560), ctx=c.getContext("2d");
  ctx.fillStyle=mix(CONFIG.bg,"#8C7B72",.18); ctx.fillRect(0,0,2240,1560);
  ctx.save(); ctx.shadowColor="rgba(40,30,25,.28)"; ctx.shadowBlur=50; ctx.shadowOffsetY=20; ctx.fillStyle="#fff"; ctx.fillRect(120,100,W*2,H); ctx.restore();
  await sbDrawPage(ctx,sb.pages[L],120,100,W);
  if(sb.pages[L+1]) await sbDrawPage(ctx,sb.pages[L+1],120+W,100,W);
  else{ctx.fillStyle="#FFF9F0";ctx.fillRect(120+W,100,W,H);}
  const gr=ctx.createLinearGradient(120+W-70,0,120+W+70,0);
  gr.addColorStop(0,"rgba(0,0,0,0)"); gr.addColorStop(.5,"rgba(0,0,0,.2)"); gr.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gr; ctx.fillRect(120+W-70,100,140,H);
  if(mark) sbDrawMark(ctx,1120,1520,30,false,"center");
  return [await toFile(c,`ourdays-spread${L+1}-${L+2}.jpg`)];
}
function sbShareSheet(idx){
  const n=sb.pages.length, hasMark=!!sbMarkText();
  let kind="post", mark=hasMark, files=null, gen=0;
  const md=document.createElement("div");
  md.className="sheetwrap"; md.setAttribute("role","dialog"); md.setAttribute("aria-modal","true"); md.setAttribute("aria-label","分享或存成圖片");
  md.innerHTML=`<div class="sheet share">
    <div class="sheethead"><h3>分享／存成圖片</h3><button class="del" id="shClose">關閉</button></div>
    <div class="sbchips" id="shKind" style="margin-top:12px">
      <button class="on" data-k="post">貼文（直式 3:4）</button><button data-k="story">限時動態（9:16）</button>
      <button data-k="spread">跨頁（橫式）</button>${n>1?`<button data-k="book">整本（每頁一張，共 ${n} 張）</button>`:""}</div>
    ${hasMark?`<label class="check" style="display:flex;margin-top:10px"><input type="checkbox" id="shMark" checked>加上「${esc(sbMarkText())}」小字</label>`:""}
    <div class="shprev"><img id="shImg" alt="預覽"><p class="msg" id="shInfo">製作中…</p></div>
    <div class="formacts"><button class="btn ghost" id="shDl" disabled>下載圖片</button><button class="btn" id="shGo" disabled>分享／存到相簿</button></div>
    <p class="hint" style="margin-top:10px">iPhone：按「分享／存到相簿」後選「儲存影像」，就會存進照片；也可以直接選要分享的 App。一次分享多張時，大部分 App 最多一次 10 張。</p>
  </div>`;
  document.body.appendChild(md);
  const close=()=>{md.remove();document.removeEventListener("keydown",onKey);};
  const onKey=e=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",onKey);
  md.addEventListener("click",e=>{if(e.target===md)close();});
  md.querySelector("#shClose").addEventListener("click",close);
  const info=t=>{md.querySelector("#shInfo").textContent=t;};
  // 先做好圖片：手機的「分享」必須在點按當下馬上叫出來，不能等製作
  const build=async()=>{
    const my=++gen; files=null;
    md.querySelector("#shGo").disabled=true; md.querySelector("#shDl").disabled=true; info("製作中…");
    try{
      const out=await sbExport(kind,idx,mark);
      if(my!==gen) return;
      files=out;
      const img=md.querySelector("#shImg"); if(img.dataset.url) URL.revokeObjectURL(img.dataset.url);
      img.dataset.url=URL.createObjectURL(out[0]); img.src=img.dataset.url;
      const dims={post:"1080 × 1440",story:"1080 × 1920",spread:"2240 × 1560",book:"1080 × 1440"}[kind];
      info(`${dims}・${out.length} 張`);
      md.querySelector("#shGo").disabled=false; md.querySelector("#shDl").disabled=false;
    }catch(e){
      if(my!==gen) return;
      info(e&&e.name==="SecurityError"?"請用網址打開網頁（不是直接開檔案），才能存成圖片。":"製作圖片時發生問題，請再試一次。");
    }
  };
  md.querySelectorAll("#shKind button").forEach(b=>b.addEventListener("click",()=>{
    kind=b.dataset.k; md.querySelectorAll("#shKind button").forEach(x=>x.classList.toggle("on",x===b)); build();
  }));
  const mk=md.querySelector("#shMark"); if(mk) mk.addEventListener("change",()=>{mark=mk.checked;build();});
  const download=()=>{
    files.forEach((f,i)=>setTimeout(()=>{
      const a=document.createElement("a"), u=URL.createObjectURL(f);
      a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
    },i*400));
  };
  md.querySelector("#shDl").addEventListener("click",()=>{if(files) download();});
  md.querySelector("#shGo").addEventListener("click",()=>{
    if(!files) return;
    const data={files,title:"我們的剪貼簿"};
    if(navigator.canShare&&navigator.canShare(data)){
      navigator.share(data).catch(e=>{if(e&&e.name!=="AbortError") info("沒有分享成功，可以改按「下載圖片」。");});
    }else{download();info("這個瀏覽器不支援直接分享，已改成下載圖片。");}
  });
  build();
}

/* ---------------- 問答 ---------------- */
let qi=0, score=0, locked=false;
function renderQuiz(){
  const box=$("#tab-quiz"), total=CONFIG.quiz.length;
  if(qi>=total){
    let best=store.get("ourdays_best",0); if(score>best){best=score;store.set("ourdays_best",best);}
    let msg=CONFIG.quizResult[0].text;
    CONFIG.quizResult.forEach(r=>{if(score>=r.min) msg=r.text;});
    box.innerHTML=`<div class="card"><div class="score">${score} / ${total}</div><p class="res">${esc(msg)}</p>
      <p class="res" style="margin-top:-8px;font-size:13px">最佳紀錄：${best} / ${total}</p>
      <button class="btn" id="again" style="width:100%">再玩一次</button></div>`;
    $("#again").addEventListener("click",()=>{qi=0;score=0;locked=false;renderQuiz();});
    return;
  }
  const q=CONFIG.quiz[qi];
  box.innerHTML=`<h2 style="margin:0 4px 14px;font-size:22px">你們有多了解彼此？</h2>
    <div class="card"><div class="prog"><b style="width:${(qi/total)*100}%"></b></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">第 ${qi+1} / ${total} 題</div>
    <div class="q">${esc(q.q)}</div>
    ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(locked) return; locked=true;
    const pick=+b.dataset.i;
    box.querySelectorAll(".opt").forEach((x,i)=>{if(i===q.answer)x.classList.add("ok");else if(i===pick)x.classList.add("no");});
    if(pick===q.answer) score++;
    setTimeout(()=>{qi++;locked=false;renderQuiz();},900);
  }));
}

/* ---------------- 分頁 ---------------- */
function show(tab,keepScroll){
  curTab=tab;
  ["home","dates","album","scrap","quiz"].forEach(t=>$("#tab-"+t).classList.toggle("hidden",t!==tab));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="home"){saying=null;renderHome();}
  if(tab==="dates") renderDates();
  if(tab==="album") cloudSync(false);
  if(tab==="scrap") showScrap();
  if(!keepScroll) window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));

/* ---------------- 加到主畫面與離線 ---------------- */
// 只在網站上（https 或 localhost）啟用；直接開本機檔案或在產生器預覽時略過
function setupPWA(){
  const web=location.protocol==="https:"||(location.protocol==="http:"&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname));
  if(!web||PREVIEW) return;
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.json"; document.head.appendChild(l);
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(reg=>{
    const urls=CONFIG.album.filter(m=>typeof m.photo==="string").map(m=>m.photo);
    if(urls.length&&reg.active) reg.active.postMessage({type:"ourdays-cache-photos",urls});
  }).catch(()=>{});
}

/* ---------------- 啟動 ---------------- */
let curTab="home", lastDay=dayNum(today0());
function boot(raw){
  BASE=normalize(raw);
  CONFIG=PREVIEW?BASE:withSettings(BASE,userSettings());
  START=CONFIG.startDate?parseDate(CONFIG.startDate):today0();
  applyTheme();
  qi=0; score=0; locked=false; saying=null; petTemp=null;
  cloudLoad();
  $("#credit").textContent=CONFIG.showCredit?CONFIG.creditText:"";
  sb.loaded=false; sb.pages=[];
  renderHome(); renderDates(); renderAlbum(); renderQuiz();
  show(curTab,true);
}
// 頁面放著跨過午夜，回到前景時重新計算
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(curTab==="album") cloudSync(false);
  if(curTab==="scrap"&&!sb.cur) sbLoad(true).then(renderScrapList);
  const d=dayNum(today0()); if(d===lastDay) return;
  lastDay=d; saying=null; renderHome(); renderDates(); celebrateToday();
});
if(PREVIEW){
  // 只接受外層產生器傳來的設定
  window.addEventListener("message",e=>{
    if(e.source!==window.parent||!e.data||e.data.type!=="ourdays-config") return;
    boot(e.data.config);
  });
  boot(window.CONFIG);
  window.parent.postMessage({type:"ourdays-ready"},"*");
}else if(!window.CONFIG){
  $(".wrap").innerHTML='<div class="card" style="margin-top:20px"><h3>找不到設定檔</h3><p style="color:var(--muted);margin-top:6px">請確認 config.js 和 index.html 放在同一個資料夾。</p></div>';
}else{
  boot(window.CONFIG);
  celebrateToday();
  setupPWA();
  cloudSync(true);
}
</script>
